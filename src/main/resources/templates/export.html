<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('export')}"></th:block>
  <h3 class="section" th:text="#{export.title}">Выгрузка коллекций в Excel</h3>
  <p class="muted" th:text="#{export.text}"></p>
  <p class="error" th:if="${error != null}" th:text="${error}"></p>
  <p class="empty" th:if="${collections.isEmpty()}" th:text="#{collections.none}">Коллекций пока нет.</p>

  <form autocomplete="off" class="form" method="post" action="/export" th:unless="${collections.isEmpty()}">
    <label class="at-field" th:text="#{export.collections}">Коллекции</label>
    <div class="export-list">
      <label class="radio all"><input type="checkbox" id="export-all"> <b th:text="#{nav.allCollections}">Все коллекции</b></label>
      <label class="radio" th:each="c : ${collections}">
        <input type="checkbox" name="c" th:value="${c.id()}">
        <span th:text="${c.name()}"></span> <span class="muted" th:text="${'(' + c.count() + ')'}"></span>
      </label>
    </div>
    <div class="full"><button class="btn" th:text="#{export.download}">Скачать Excel</button></div>
  </form>

<script>
  // «Все коллекции» отмечает или снимает все; галочка сама следит за выбором
  (function () {
    var all = document.getElementById('export-all');
    if (!all) return;
    var boxes = Array.prototype.slice.call(document.querySelectorAll('input[name=c]'));
    function sync() {
      var n = boxes.filter(function (b) { return b.checked; }).length;
      all.checked = n === boxes.length; all.indeterminate = n > 0 && n < boxes.length;
    }
    all.addEventListener('change', function () { boxes.forEach(function (b) { b.checked = all.checked; }); });
    boxes.forEach(function (b) { b.addEventListener('change', sync); });
  })();
</script>
</main>
</body>
</html>
