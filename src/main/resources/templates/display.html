<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('display')}"></th:block>
  <p class="ok" th:if="${param.saved != null}" th:text="#{display.saved}">Настройки сохранены.</p>
  <form autocomplete="off" class="form" method="post" action="/display">
    <label for="f-show" th:text="#{display.prices}">Цены</label>
    <div>
      <label class="radio"><input id="f-show" type="checkbox" name="showPrices" value="true" th:checked="${showPrices}"> <span th:text="#{display.showPrices}">Показывать цены</span></label>
      <div class="muted" th:text="#{display.showPricesHint}"></div>
    </div>

    <label for="f-coll-pp" th:text="#{display.collectionsPerPage}">Коллекций на странице</label>
    <div>
      <input id="f-coll-pp" class="narrow" type="number" name="collectionsPerPage" required autocomplete="off" step="1"
             th:min="${T(app.Repo.PageSizes).MIN_COLLECTIONS}" th:max="${T(app.Repo.PageSizes).MAX_COLLECTIONS}"
             th:value="${pageSizes.collections()}">
      <div class="muted" th:text="#{display.collectionsPerPageHint(${T(app.Repo.PageSizes).MIN_COLLECTIONS}, ${T(app.Repo.PageSizes).MAX_COLLECTIONS})}"></div>
    </div>

    <label for="f-items-pp" th:text="#{display.itemsPerPage}">Объектов на странице</label>
    <div>
      <input id="f-items-pp" class="narrow" type="number" name="itemsPerPage" required autocomplete="off" step="1"
             th:min="${T(app.Repo.PageSizes).MIN_ITEMS}" th:max="${T(app.Repo.PageSizes).MAX_ITEMS}"
             th:value="${pageSizes.items()}">
      <div class="muted" th:text="#{display.itemsPerPageHint(${T(app.Repo.PageSizes).MIN_ITEMS}, ${T(app.Repo.PageSizes).MAX_ITEMS})}"></div>
    </div>

    <div class="full"><button class="btn" th:text="#{btn.save}">Сохранить</button></div>
  </form>
</main>
</body>
</html>
