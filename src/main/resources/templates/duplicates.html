<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar collhead">
    <a class="btn light back" th:href="@{/collections/{id}(id=${c.id()})}" title="К коллекции" aria-label="К коллекции"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <div>
      <h2>Дубли</h2>
      <div class="muted">
        <span th:text="${c.name()}"></span> ·
        <span th:text="${'Групп: ' + groups.size() + ', объектов: ' + dupCount}"></span>
      </div>
    </div>
  </div>

  <p class="empty" th:if="${groups.isEmpty()}">В коллекции нет объектов с одинаковыми названиями.</p>

  <!-- Строки — тот же фрагмент, что на странице коллекции; группы чередуются фоном, первая строка группы — с линией сверху -->
  <table class="items dups" th:unless="${groups.isEmpty()}">
    <thead><tr class="head">
      <th th:each="col : ${cols}" th:class="${col.css()}" th:text="${col.label()}"></th>
      <th class="actions"></th>
    </tr></thead>
    <tbody>
      <th:block th:each="g, gs : ${groups}">
        <th:block th:each="it, is : ${g}" th:with="grp=${(gs.odd ? 'g1' : 'g2') + (is.first ? ' gstart' : '')}">
          <tr th:replace="~{collection :: itemRow}"></tr>
        </th:block>
      </th:block>
    </tbody>
  </table>

  <th:block th:replace="~{base :: itemDialog}"></th:block>
</main>
</body>
</html>
