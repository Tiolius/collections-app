<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="auth">
  <h2 th:text="${setup ? #messages.msg('login.setupTitle') : #messages.msg('login.title')}"></h2>
  <p class="muted" th:if="${setup}" th:text="#{login.setupText}"></p>
  <p class="error" th:if="${error != null}" th:text="${error}"></p>
  <!-- Browser suggestions in the login fields are off: autocomplete="off" for the name,
       "new-password" for the password (browsers ignore "off" on password fields) -->
  <form class="form" method="post" autocomplete="off" th:action="${setup ? '/setup' : '/login'}">
    <label for="f-name" th:text="#{user.name}">Имя пользователя</label>
    <input id="f-name" type="text" name="name" required autofocus autocomplete="off" autocapitalize="off" spellcheck="false" th:value="${name}">

    <label for="f-pw"><span th:text="#{user.password}">Пароль</span><th:block th:if="${setup}"> <span th:replace="~{base :: info(#{password.hint})}"></span></th:block></label>
    <input id="f-pw" type="password" name="password" autocomplete="new-password">

    <th:block th:if="${setup}">
      <label for="f-pw2" th:text="#{user.password2}">Повторите пароль</label>
      <input id="f-pw2" type="password" name="password2" autocomplete="new-password">
    </th:block>

    <!-- "Remember me": a sign-in key in a cookie for 90 days (Remember), the password is not saved -->
    <th:block th:unless="${setup}">
      <span></span>
      <div class="remember"><label class="radio"><input id="f-remember" type="checkbox" name="remember" value="true" autocomplete="off">
        <span th:text="#{login.remember}">Запомнить меня</span></label>
        <span th:replace="~{base :: info(#{login.rememberHint})}"></span></div>
    </th:block>

    <div class="full end"><button class="btn" th:text="${setup ? #messages.msg('login.createAdmin') : #messages.msg('login.signIn')}"></button></div>
  </form>
</main>
</body>
</html>
