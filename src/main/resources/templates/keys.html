<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('keys')}"></th:block>
  <!-- Ключ RAWG: у каждого пользователя свой; сам ключ на страницу не выводится -->
  <h3 class="section">Ключ RAWG</h3>
  <p class="ok" th:if="${param.rawg != null and param.rawg[0] == 'saved'}">Ключ RAWG сохранён и проверен.</p>
  <p class="ok" th:if="${param.rawg != null and param.rawg[0] == 'unchecked'}">Ключ RAWG сохранён, но проверить его не удалось: RAWG недоступен.</p>
  <p class="ok" th:if="${param.rawg != null and param.rawg[0] == 'deleted'}">Ключ RAWG удалён.</p>
  <p class="error" th:if="${param.rawg != null and param.rawg[0] == 'invalid'}">RAWG отклонил ключ: проверьте его. Ключ не сохранён.</p>
  <form autocomplete="off" class="form" method="post" action="/keys/rawg">
    <label for="f-rawg">Ключ
      <span class="icon tip help" tabindex="0" aria-label="Справка о ключе RAWG"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
        <span class="tiptext">
          <span>Нужен для импорта из RAWG (база игр, в том числе тех, которых нет в Steam).</span>
          <span>Получить: зарегистрируйтесь на rawg.io (по email) и откройте rawg.io/apidocs → Get API Key.
            Бесплатно — около 20 000 запросов в месяц (на игру уходит 1–2 запроса).</span>
          <span>Ключ виден только вам и используется только для запросов к RAWG.</span>
        </span>
      </span>
    </label>
    <div>
      <input type="password" id="f-rawg" name="key" autocomplete="new-password" maxlength="200" required
             th:placeholder="${rawgReady ? 'сохранён: …' + rawgKeyEnd + ' (введите новый, чтобы заменить)' : 'не задан'}">
    </div>
    <div class="full split">  <!-- «Сохранить» слева, «Удалить ключ» — у правого края формы -->
      <button class="btn">Сохранить</button>
      <button class="btn light danger" name="delete" value="true" th:if="${rawgReady}" formnovalidate
              onclick="return confirm('Удалить ключ RAWG?')">Удалить ключ</button>
    </div>
  </form>
</main>
</body>
</html>
