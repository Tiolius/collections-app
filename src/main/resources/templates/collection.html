<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar collhead" th:unless="${dups}">
    <a class="btn light back" href="/" title="Все коллекции" aria-label="Все коллекции"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <img class="thumb" th:if="${c.hasImage()}" th:src="@{/collections/{id}/image(id=${c.id()})}" alt="">
    <div>
      <h2 th:text="${c.name()}"></h2>
      <div class="muted meta-line">
        <span th:text="${'Тип: ' + (c.kind() == null ? '—' : c.kind())}"></span> <span>·</span>
        <span th:text="${'Объектов: ' + totalAll}"></span>
        <th:block th:if="${totalPrice != null and showPrices}"><span>·</span> <span th:text="${'Стоимость: ' + totalPrice + ' ₽'}"></span></th:block>
        <span class="icon tip right small" tabindex="0" aria-label="Стоимость коллекции" th:if="${totalPrice != null and !showPrices}">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M600.5-379.5Q650-429 650-500t-49.5-120.5Q551-670 480-670t-120.5 49.5Q310-571 310-500t49.5 120.5Q409-330 480-330t120.5-49.5Zm-200-41Q368-453 368-500t32.5-79.5Q433-612 480-612t79.5 32.5Q592-547 592-500t-32.5 79.5Q527-388 480-388t-79.5-32.5ZM216-283Q98-366 40-500q58-134 176-217t264-83q146 0 264 83t176 217q-58 134-176 217t-264 83q-146 0-264-83Zm264-217Zm222.5 174.5Q804-391 857-500q-53-109-154.5-174.5T480-740q-121 0-222.5 65.5T102-500q54 109 155.5 174.5T480-260q121 0 222.5-65.5Z"/></svg>
          <span class="tiptext" th:text="${'Стоимость коллекции: ' + totalPrice + ' ₽'}"></span>
        </span>
      </div>
    </div>
    <span class="spacer"></span>
    <a class="icon big add" title="Новый объект" aria-label="Новый объект" th:href="@{/collections/{id}/items/new(id=${c.id()})}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M550-320h60v-90h90v-60h-90v-90h-60v90h-90v60h90v90ZM140-160q-24 0-42-18.5T80-220v-520q0-23 18-41.5t42-18.5h281l60 60h339q23 0 41.5 18.5T880-680v460q0 23-18.5 41.5T820-160H140Zm0-60h680v-460H456l-60-60H140v520Zm0 0v-520 520Z"/></svg></a>
    <a class="icon big" title="Дубли" aria-label="Дубли" th:href="@{/collections/{id}(id=${c.id()},dups=1)}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M300-200q-24 0-42-18t-18-42v-560q0-24 18-42t42-18h440q24 0 42 18t18 42v560q0 24-18 42t-42 18H300Zm0-60h440v-560H300v560ZM180-80q-24 0-42-18t-18-42v-620h60v620h500v60H180Zm120-180v-560 560Z"/></svg></a>
    <a class="icon big" title="Изменить коллекцию" aria-label="Изменить коллекцию" th:href="@{/collections/{id}/edit(id=${c.id()})}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-180h44l472-471-44-44-472 471v44Zm-60 60v-128l575-574q8-8 19-12.5t23-4.5q11 0 22 4.5t20 12.5l44 44q9 9 13 20t4 22q0 11-4.5 22.5T823-694L248-120H120Zm659-617-41-41 41 41Zm-105 64-22-22 44 44-22-22Z"/></svg></a>
    <form autocomplete="off" class="inline" method="post" th:action="@{/collections/{id}/delete(id=${c.id()})}"
          onsubmit="return confirm('Удалить коллекцию и все её объекты?')">
      <button class="icon big red" title="Удалить коллекцию" aria-label="Удалить коллекцию"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-41v-60h188v-30h264v30h188v60h-41v570q0 24-18 42t-42 18H261Zm438-630H261v570h438v-570ZM367-266h60v-399h-60v399Zm166 0h60v-399h-60v399ZM261-750v570-570Z"/></svg></button>
    </form>
  </div>
  <div class="bar collhead" th:if="${dups}">
    <a class="btn light back" th:href="@{/collections/{id}(id=${c.id()})}" title="К коллекции" aria-label="К коллекции"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <div>
      <h2>Дубли</h2>
      <div class="muted">
        <span th:text="${c.name()}"></span> ·
        <span th:text="${'Групп: ' + dupGroups + ', объектов: ' + totalAll}"></span>
      </div>
    </div>
  </div>

  <p class="empty" th:if="${totalAll == 0}" th:text="${dups ? 'В коллекции нет объектов с одинаковыми названиями.' : 'В коллекции пока нет объектов.'}"></p>

  <th:block th:if="${totalAll > 0}">
  <!-- Форма фильтров: поля фильтров в шапке таблицы и размер страницы привязаны к ней атрибутом form -->
  <form autocomplete="off" id="filter-form" method="get" th:action="@{/collections/{id}(id=${c.id()})}"
        onsubmit="for (const el of this.elements) if (el.name && !el.value) el.disabled = true">
    <input type="hidden" name="dups" value="1" th:if="${dups}">
    <input type="hidden" name="sort" th:value="${sort}">
    <input type="hidden" name="dir" th:value="${dir}">
    <button hidden>Найти</button>
  </form>
  <div class="bar pager">
    <span class="muted" th:text="${(total == 0 ? 'Ничего не найдено' : 'Показано ' + from + '–' + to + ' из ' + total)
          + (filters.isEmpty() ? '' : ' (отфильтровано, всего ' + (dups ? 'дублей ' : 'в коллекции ') + totalAll + ')')}"></span>
    <span class="pages" th:if="${pages > 1}">
      <th:block th:each="p : ${pageLinks}">
        <span th:if="${p == 0}" class="muted">…</span>
        <b th:if="${p == page}" th:text="${p}"></b>
        <a th:if="${p != 0 and p != page}" th:text="${p}"
           th:href="|?sort=${sort}&dir=${dir}&page=${p}&size=${size}${filterQs}${modeQs}|"></a>
      </th:block>
    </span>
    <span class="spacer"></span>
    <label class="muted" for="page-size">На странице:</label>
    <select id="page-size" name="size" form="filter-form" onchange="this.form.requestSubmit()">
      <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}"></option>
    </select>
    <button type="button" class="btn light small" id="reset-widths" title="Вернуть исходную ширину столбцов">Сбросить ширину столбцов</button>
  </div>

  <table class="items" th:attr="data-cols=${#strings.listJoin(cols.![key()], ',') + (showPrices ? ':prices' : '')}">
    <thead><tr class="head">
      <th th:each="col : ${cols}" th:class="${col.css()}">
        <a class="sort" th:title="${col.key() == 'price' ? 'Сортировать по цене' : null}"
           th:href="|?sort=${col.key()}&dir=${sort == col.key() and dir == 'asc' ? 'desc' : 'asc'}&size=${size}${filterQs}${modeQs}|"
           th:text="${col.label() + (sort == col.key() ? (dir == 'asc' ? ' ▲' : ' ▼') : '')}"></a>
        <span class="grip" title="Потяните, чтобы изменить ширину"></span>
      </th>
      <th class="actions"></th>
    </tr>
    <tr class="filters">
      <th th:each="col : ${cols}" th:class="${col.css()}">
        <input th:if="${col.key() == 'name'}" type="search" name="f_name" form="filter-form" placeholder="Поиск по названию…"
               autocomplete="off" th:value="${filters.get('name')}" th:classappend="${filters.containsKey('name')} ? 'active'">
        <select th:if="${filterOptions.containsKey(col.key())}" th:name="${'f_' + col.key()}" form="filter-form"
                onchange="this.form.requestSubmit()" th:classappend="${filters.containsKey(col.key())} ? 'active'">
          <option value="">Все</option>
          <option th:each="v : ${filterOptions.get(col.key())}" th:value="${v}" th:text="${v}"
                  th:selected="${v == filters.get(col.key())}"></option>
        </select>
      </th>
      <th class="actions">
        <a th:unless="${filters.isEmpty()}" class="icon" title="Сбросить фильтры" aria-label="Сбросить фильтры"
           th:href="|?sort=${sort}&dir=${dir}&size=${size}${modeQs}|"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m580-465-43-43 183-232H305l-60-60h527q21 0 31 19t-4 36L580-465ZM813-61 560-314v114q0 17-11.5 28.5T520-160h-80q-17 0-28.5-11.5T400-200v-274L61-813l43-43 752 752-43 43ZM537-508Z"/></svg></a>
        <span th:if="${filters.isEmpty()}" class="icon disabled" title="Фильтры не заданы" aria-label="Фильтры не заданы"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m580-465-43-43 183-232H305l-60-60h527q21 0 31 19t-4 36L580-465ZM813-61 560-314v114q0 17-11.5 28.5T520-160h-80q-17 0-28.5-11.5T400-200v-274L61-813l43-43 752 752-43 43ZM537-508Z"/></svg></span>
      </th>
    </tr></thead>
    <tbody><th:block th:each="it : ${items}" th:with="grp=${groupStarts.contains(it.id()) ? 'gstart' : null}">
    <tr th:fragment="itemRow" th:class="${grp}"
               th:with="bg=${fields.contains('status') ? statusColors.get(#strings.toLowerCase(#strings.trim(it.status()))) : null}"
               th:style="${bg != null ? '--row-bg:' + bg : null}"
               th:data-id="${it.id()}" th:data-name="${it.name()}" th:data-platform="${it.platform()}"
               th:data-format="${it.format()}" th:data-status="${it.status()}" th:data-price="${it.price()}">
      <td class="title" th:text="${it.name()}" th:title="${it.name()}"></td>
      <td th:if="${fields.contains('platform')}" th:text="${it.platform()}"></td>
      <td th:if="${fields.contains('format')}" th:text="${it.format()}"></td>
      <td th:if="${fields.contains('status')}" th:text="${it.status()}"></td>
      <td class="num" th:if="${fields.contains('price') and showPrices}"
          th:text="${it.price() == null ? '' : #numbers.formatInteger(it.price(), 1, 'WHITESPACE') + ' ₽'}"></td>
      <td class="eye" th:if="${fields.contains('price') and !showPrices}">
        <span class="icon tip" tabindex="0" aria-label="Цена" th:classappend="${it.price() == null} ? 'none'">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M600.5-379.5Q650-429 650-500t-49.5-120.5Q551-670 480-670t-120.5 49.5Q310-571 310-500t49.5 120.5Q409-330 480-330t120.5-49.5Zm-200-41Q368-453 368-500t32.5-79.5Q433-612 480-612t79.5 32.5Q592-547 592-500t-32.5 79.5Q527-388 480-388t-79.5-32.5ZM216-283Q98-366 40-500q58-134 176-217t264-83q146 0 264 83t176 217q-58 134-176 217t-264 83q-146 0-264-83Zm264-217Zm222.5 174.5Q804-391 857-500q-53-109-154.5-174.5T480-740q-121 0-222.5 65.5T102-500q54 109 155.5 174.5T480-260q121 0 222.5-65.5Z"/></svg>
          <span class="tiptext" th:text="${it.price() == null ? 'Цена не указана' : 'Цена: ' + it.price() + ' ₽'}"></span>
        </span>
      </td>
      <td class="actions">
        <a class="icon edit-item" title="Изменить" aria-label="Изменить" th:href="@{/items/{id}/edit(id=${it.id()},view=${view})}">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-180h44l472-471-44-44-472 471v44Zm-60 60v-128l575-574q8-8 19-12.5t23-4.5q11 0 22 4.5t20 12.5l44 44q9 9 13 20t4 22q0 11-4.5 22.5T823-694L248-120H120Zm659-617-41-41 41 41Zm-105 64-22-22 44 44-22-22Z"/></svg>
        </a>
        <form autocomplete="off" class="inline" method="post" th:action="@{/items/{id}/delete(id=${it.id()})}"
              onsubmit="return confirm('Удалить объект?')">
          <input type="hidden" name="view" th:value="${view}">
          <button class="icon red" title="Удалить" aria-label="Удалить">
            <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-41v-60h188v-30h264v30h188v60h-41v570q0 24-18 42t-42 18H261Zm438-630H261v570h438v-570ZM367-266h60v-399h-60v399Zm166 0h60v-399h-60v399ZM261-750v570-570Z"/></svg>
          </button>
        </form>
      </td>
    </tr>
    </th:block>
    <tr th:if="${items.isEmpty()}"><td class="empty" th:colspan="${cols.size() + 1}">Ничего не найдено. Измените или сбросьте фильтры.</td></tr>
    </tbody>
  </table>
  </th:block>

  <th:block th:replace="~{base :: itemDialog}"></th:block>
</main>
<script>
  // Ширина столбцов: потянуть за правый край заголовка. Запоминается в браузере (localStorage).
  (function () {
    var table = document.querySelector('table.items');
    if (!table) return;
    var key = 'colw:' + table.dataset.cols;
    var ths = Array.prototype.slice.call(table.querySelectorAll('thead tr.head th'));
    // Текущая ширина столбца с запасом на округление, чтобы текст не обрезался
    function width(th) { return Math.ceil(th.getBoundingClientRect().width) + 1; }
    // Ширина таблицы = сумма столбцов, чтобы менялся только тот столбец, который тянут
    function fitTable() {
      table.style.width = ths.reduce(function (sum, th) { return sum + parseInt(th.style.width, 10); }, 0) + 'px';
    }
    function fix(widths) {
      ths.forEach(function (th, i) { th.style.width = widths[i] + 'px'; });
      fitTable();
      table.classList.add('fixed');
    }
    function save() {
      try { localStorage.setItem(key, JSON.stringify(ths.map(function (th) { return parseInt(th.style.width, 10); }))); } catch (e) {}
    }
    try {
      var saved = JSON.parse(localStorage.getItem(key));
      if (saved && saved.length === ths.length) fix(saved);
    } catch (e) {}
    ths.forEach(function (th) {
      var grip = th.querySelector('.grip');
      if (!grip) return;
      grip.addEventListener('mousedown', function (e) {
        e.preventDefault();
        if (!table.classList.contains('fixed')) fix(ths.map(width));
        var startX = e.clientX, startW = parseInt(th.style.width, 10);
        document.body.classList.add('resizing');
        function move(ev) { th.style.width = Math.max(40, startW + ev.clientX - startX) + 'px'; fitTable(); }
        function up() {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          document.body.classList.remove('resizing');
          save();
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    });
    document.getElementById('reset-widths').addEventListener('click', function (e) {
      e.preventDefault();
      try { localStorage.removeItem(key); } catch (err) {}
      location.reload();
    });
  })();
</script>
</body>
</html>
