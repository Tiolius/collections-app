<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar collhead" th:unless="${dups}">
    <a class="btn light back" href="/" th:title="#{nav.allCollections}" th:aria-label="#{nav.allCollections}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <img class="thumb" th:if="${c.hasImage()}" th:src="@{/img/{h}/thumb(h=${c.pic()})}" alt="">
    <div>
      <h2 th:text="${c.name()}"></h2>
      <div class="muted meta-line">
        <span th:text="#{coll.type(${c.kind() == null ? '—' : c.kind()})}"></span> <span class="sep">·</span>
        <span th:text="#{coll.items(${totalAll})}"></span>
        <th:block th:if="${totalPrice != null and showPrices}"><span class="sep">·</span> <span th:text="#{coll.value(${totalPrice})}"></span></th:block>
        <span class="icon tip right small" tabindex="0" th:aria-label="#{coll.valueLabel}" th:if="${totalPrice != null and !showPrices}">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M600.5-379.5Q650-429 650-500t-49.5-120.5Q551-670 480-670t-120.5 49.5Q310-571 310-500t49.5 120.5Q409-330 480-330t120.5-49.5Zm-200-41Q368-453 368-500t32.5-79.5Q433-612 480-612t79.5 32.5Q592-547 592-500t-32.5 79.5Q527-388 480-388t-79.5-32.5ZM216-283Q98-366 40-500q58-134 176-217t264-83q146 0 264 83t176 217q-58 134-176 217t-264 83q-146 0-264-83Zm264-217Zm222.5 174.5Q804-391 857-500q-53-109-154.5-174.5T480-740q-121 0-222.5 65.5T102-500q54 109 155.5 174.5T480-260q121 0 222.5-65.5Z"/></svg>
          <span class="tiptext" th:text="#{coll.valueTip(${totalPrice})}"></span>
        </span>
      </div>
    </div>
    <!-- Действия с коллекцией — всегда одной строкой (на телефоне переносятся целиком под название) -->
    <div class="coll-actions">
      <a class="icon big add new-item" th:title="#{item.new}" th:aria-label="#{item.new}" th:href="@{/collections/{id}/items/new(id=${c.id()})}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M550-320h60v-90h90v-60h-90v-90h-60v90h-90v60h90v90ZM140-160q-24 0-42-18.5T80-220v-520q0-23 18-41.5t42-18.5h281l60 60h339q23 0 41.5 18.5T880-680v460q0 23-18.5 41.5T820-160H140Zm0-60h680v-460H456l-60-60H140v520Zm0 0v-520 520Z"/></svg></a>
      <a class="icon big" th:title="#{dups.title}" th:aria-label="#{dups.title}" th:href="@{/collections/{id}(id=${c.id()},dups=1)}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M300-200q-24 0-42-18t-18-42v-560q0-24 18-42t42-18h440q24 0 42 18t18 42v560q0 24-18 42t-42 18H300Zm0-60h440v-560H300v560ZM180-80q-24 0-42-18t-18-42v-620h60v620h500v60H180Zm120-180v-560 560Z"/></svg></a>
      <a class="icon big" th:title="#{coll.edit}" th:aria-label="#{coll.edit}" th:href="@{/collections/{id}/edit(id=${c.id()})}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-180h44l472-471-44-44-472 471v44Zm-60 60v-128l575-574q8-8 19-12.5t23-4.5q11 0 22 4.5t20 12.5l44 44q9 9 13 20t4 22q0 11-4.5 22.5T823-694L248-120H120Zm659-617-41-41 41 41Zm-105 64-22-22 44 44-22-22Z"/></svg></a>
      <form autocomplete="off" class="inline" method="post" th:action="@{/collections/{id}/delete(id=${c.id()})}"
            th:data-confirm="#{coll.deleteConfirm}" onsubmit="return appConfirm(event, this.dataset.confirm)">
        <button class="icon big red" th:title="#{coll.delete}" th:aria-label="#{coll.delete}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-41v-60h188v-30h264v30h188v60h-41v570q0 24-18 42t-42 18H261Zm438-630H261v570h438v-570ZM367-266h60v-399h-60v399Zm166 0h60v-399h-60v399ZM261-750v570-570Z"/></svg></button>
      </form>
    </div>
  </div>
  <div class="bar collhead" th:if="${dups}">
    <a class="btn light back" th:href="@{/collections/{id}(id=${c.id()})}" th:title="#{dups.back}" th:aria-label="#{dups.back}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <div>
      <h2 th:text="#{dups.title}">Дубли</h2>
      <div class="muted">
        <span th:text="${c.name()}"></span> ·
        <span th:text="#{dups.counts(${dupGroups}, ${totalAll})}"></span>
      </div>
    </div>
  </div>

  <p class="empty" th:if="${totalAll == 0}" th:text="${dups ? #messages.msg('dups.none') : #messages.msg('coll.empty')}"></p>

  <th:block th:if="${totalAll > 0}">
  <!-- Форма фильтров: поля фильтров в шапке таблицы и размер страницы привязаны к ней атрибутом form -->
  <form autocomplete="off" id="filter-form" method="get" th:action="@{/collections/{id}(id=${c.id()})}"
        onsubmit="for (const el of this.elements) if (el.name && !el.value) el.disabled = true">
    <input type="hidden" name="dups" value="1" th:if="${dups}">
    <input type="hidden" name="sort" th:value="${sort}">
    <input type="hidden" name="dir" th:value="${dir}">
    <button hidden th:text="#{coll.find}">Найти</button>
  </form>
  <div class="bar pager">
    <span class="muted" th:text="${(total == 0 ? #messages.msg('coll.nothingFound') : #messages.msg('coll.shown', from, to, total))
          + (filters.isEmpty() ? '' : ' ' + #messages.msg(dups ? 'coll.filteredDups' : 'coll.filtered', totalAll))}"></span>
    <span class="pages" th:if="${pages > 1}">
      <th:block th:each="p : ${pageLinks}">
        <span th:if="${p == 0}" class="muted">…</span>
        <b th:if="${p == page}" th:text="${p}"></b>
        <a th:if="${p != 0 and p != page}" th:text="${p}"
           th:href="|?sort=${sort}&dir=${dir}&page=${p}&size=${size}${filterQs}${modeQs}|"></a>
      </th:block>
    </span>
    <span class="spacer"></span>
    <label class="muted" for="page-size" th:text="#{coll.pageSize}">На странице:</label>
    <select id="page-size" name="size" form="filter-form" onchange="this.form.requestSubmit()">
      <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}"></option>
    </select>
    <!-- После «На странице»: сбросить ширину столбцов и сбросить фильтры -->
    <span class="pager-tools">
      <button type="button" class="icon" id="reset-widths" th:title="#{coll.resetWidths}" th:aria-label="#{coll.resetWidths}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M140-160q-24.75 0-42.37-17.63Q80-195.25 80-220v-520q0-24.75 17.63-42.38Q115.25-800 140-800h680q24.75 0 42.38 17.62Q880-764.75 880-740v520q0 24.75-17.62 42.37Q844.75-160 820-160H140Zm0-60h187v-520H140v520Zm247 0h186v-520H387v520Zm246 0h187v-520H633v520Zm-246 0v-520 520Z"/></svg></button>
      <a th:unless="${filters.isEmpty()}" class="icon" th:title="#{coll.resetFilters}" th:aria-label="#{coll.resetFilters}"
           th:href="|?sort=${sort}&dir=${dir}&size=${size}${modeQs}|"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m580-465-43-43 183-232H305l-60-60h527q21 0 31 19t-4 36L580-465ZM813-61 560-314v114q0 17-11.5 28.5T520-160h-80q-17 0-28.5-11.5T400-200v-274L61-813l43-43 752 752-43 43ZM537-508Z"/></svg></a>
      <span th:if="${filters.isEmpty()}" class="icon disabled" th:title="#{coll.noFilters}" th:aria-label="#{coll.noFilters}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m580-465-43-43 183-232H305l-60-60h527q21 0 31 19t-4 36L580-465ZM813-61 560-314v114q0 17-11.5 28.5T520-160h-80q-17 0-28.5-11.5T400-200v-274L61-813l43-43 752 752-43 43ZM537-508Z"/></svg></span>
    </span>
  </div>

  <!-- Массовые действия: галочки строк (name="ids", form="bulk-form"); панель видна, когда что-то выбрано -->
  <form autocomplete="off" id="bulk-form" class="bulk" method="post" th:action="@{/collections/{id}/bulk(id=${c.id()})}" hidden
        th:data-confirm="#{bulk.deleteConfirm}"
        onsubmit="return this.elements.action.value !== 'delete' || appConfirm(event, this.dataset.confirm.replace('{0}', document.querySelectorAll('input[name=ids]:checked').length))">
    <input type="hidden" name="view" th:value="${view}">
    <span><span th:text="#{bulk.selected}">Выбрано:</span> <b id="bulk-count">0</b></span>
    <select name="action" id="bulk-action" required>
      <option value="" selected disabled th:text="#{bulk.choose}">— действие —</option>
      <option value="available" th:if="${fields.contains('available')}" th:text="#{field.available}">Наличие</option>
      <option value="status" th:if="${fields.contains('status')}" th:text="#{field.status}">Статус прохождения</option>
      <option value="rating" th:if="${fields.contains('rating')}" th:text="#{field.rating}">Рейтинг</option>
      <option value="move" th:unless="${moveTargets.isEmpty()}" th:text="#{bulk.move}">Перенести в коллекцию</option>
      <option value="delete" th:text="#{js.delete}">Удалить</option>
    </select>
    <!-- значение для выбранного действия: видно и отправляется только одно -->
    <select name="value" data-for="available" th:if="${fields.contains('available')}" hidden disabled>
      <option value="1" th:text="#{available.yes}">Есть</option>
      <option value="0" th:text="#{available.no}">Нет</option>
    </select>
    <select name="value" data-for="status" th:if="${fields.contains('status')}" hidden disabled>
      <option value="">—</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
    </select>
    <select name="value" data-for="rating" th:if="${fields.contains('rating')}" hidden disabled>
      <option value="0" th:text="#{rating.none}">Без рейтинга</option>
      <option th:each="n : ${#numbers.sequence(1, 10)}" th:value="${n}"
              th:text="${'★ ' + (n / 2) + (n % 2 == 1 ? #messages.msg('js.decimal') + '5' : '')}"></option>
    </select>
    <select name="value" data-for="move" th:unless="${moveTargets.isEmpty()}" hidden disabled>
      <option th:each="t : ${moveTargets}" th:value="${t.id()}" th:text="${t.name()}"></option>
    </select>
    <button class="btn" th:text="#{bulk.apply}">Применить</button>
    <button type="button" class="btn gray" id="bulk-clear" th:text="#{bulk.clear}">Снять выделение</button>
  </form>

  <table class="items" th:attr="data-cols=${#strings.listJoin(cols.![key()], ',') + (showPrices ? ':prices' : '') + ':pic:sel'}">
    <thead><tr class="head">
      <th class="sel"><input type="checkbox" id="sel-all" th:title="#{bulk.all}" th:aria-label="#{bulk.all}"></th>
      <th th:each="col : ${cols}" th:class="${col.css() + ' c-' + col.key()}">
        <span th:unless="${sortable.contains(col.key())}" th:text="${#messages.msg(col.label())}"></span>
        <a class="sort" th:if="${sortable.contains(col.key())}" th:title="${col.key() == 'price' ? #messages.msg('coll.sortByPrice') : null}"
           th:href="|?sort=${col.key()}&dir=${sort == col.key() and dir == 'asc' ? 'desc' : 'asc'}&size=${size}${filterQs}${modeQs}|"
           th:text="${#messages.msg(col.label()) + (sort == col.key() ? (dir == 'asc' ? ' ▲' : ' ▼') : '')}"></a>
        <span class="grip" th:title="#{coll.dragWidth}"></span>
      </th>
      <!-- Картинка: иконка у объектов, у которых она есть -->
      <th class="pic-col" th:title="#{field.image}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h600q24 0 42 18t18 42v600q0 24-18 42t-42 18H180Zm0-60h600v-600H180v600Zm56-97h489L578-473 446-302l-93-127-117 152Zm-56 97v-600 600Z"/></svg></th>
    </tr>
    <tr class="filters">
      <th class="sel"></th>
      <th th:each="col : ${cols}" th:class="${col.css() + ' c-' + col.key()}">
        <!-- Набор с клавиатуры — применяется по Enter; вставка (Ctrl+V, меню, перетаскивание) — сразу -->
        <input th:if="${col.key() == 'name'}" type="search" name="f_name" form="filter-form" th:placeholder="#{coll.searchName}"
               oninput="if (/^insertFrom(Paste|Drop)/.test(event.inputType)) this.form.requestSubmit()"
               autocomplete="off" th:value="${filters.get('name')}" th:classappend="${filters.containsKey('name')} ? 'active'">
        <select th:if="${filterOptions.containsKey(col.key())}" th:name="${'f_' + col.key()}" form="filter-form"
                onchange="this.form.requestSubmit()" th:classappend="${filters.containsKey(col.key())} ? 'active'">
          <option value="" th:text="#{filter.all}">Все</option>
          <option th:each="v : ${filterOptions.get(col.key())}" th:value="${v}" th:text="${v}"
                  th:selected="${v == filters.get(col.key())}"></option>
        </select>
        <select th:if="${col.key() == 'available'}" name="f_available" form="filter-form"
                onchange="this.form.requestSubmit()" th:classappend="${filters.containsKey('available')} ? 'active'">
          <option value="" th:text="#{filter.all}">Все</option>
          <option value="1" th:selected="${filters.get('available') == '1'}" th:text="#{available.yes}">Есть</option>
          <option value="0" th:selected="${filters.get('available') == '0'}" th:text="#{available.no}">Нет</option>
        </select>
        <select th:if="${col.key() == 'rating'}" name="f_rating" form="filter-form" th:title="#{field.rating}"
                onchange="this.form.requestSubmit()" th:classappend="${filters.containsKey('rating')} ? 'active'">
          <option value="" th:text="#{filter.all}">Все</option>
          <option value="0" th:selected="${filters.get('rating') == '0'}" th:text="#{rating.none}">Без рейтинга</option>
          <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="#{filter.ratingFrom(${n})}"
                  th:selected="${filters.get('rating') == '' + n}"></option>
        </select>
        <div th:if="${col.key() == 'price'}" class="range">
          <input type="number" name="f_price_min" form="filter-form" min="0" step="1" th:placeholder="#{filter.from}" th:title="#{filter.priceFrom}"
                 autocomplete="off" th:value="${filters.get('price_min')}" th:classappend="${filters.containsKey('price_min')} ? 'active'">
          <input type="number" name="f_price_max" form="filter-form" min="0" step="1" th:placeholder="#{filter.to}" th:title="#{filter.priceTo}"
                 autocomplete="off" th:value="${filters.get('price_max')}" th:classappend="${filters.containsKey('price_max')} ? 'active'">
        </div>
      </th>
      <th class="pic-col">
        <!-- Картинки: есть / нет / ровно N (например, найти объекты, где после импорта одна картинка) -->
        <select name="f_images" form="filter-form" onchange="this.form.requestSubmit()" th:title="#{filter.images}"
                th:classappend="${filters.containsKey('images')} ? 'active'">
          <option value="" th:text="#{filter.all}">Все</option>
          <option value="any" th:selected="${filters.get('images') == 'any'}" th:text="#{available.yes}">Есть</option>
          <option value="0" th:selected="${filters.get('images') == '0'}" th:text="#{available.no}">Нет</option>
          <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n}"
                  th:selected="${filters.get('images') == '' + n}"></option>
        </select>
      </th>
    </tr></thead>
    <tbody><th:block th:each="it : ${items}" th:with="grp=${groupStarts.contains(it.id()) ? 'gstart' : null}">
    <tr th:fragment="itemRow" th:class="${grp}"
               th:with="bg=${fields.contains('status') ? statusColors.get(#strings.toLowerCase(#strings.trim(it.status()))) : null}"
               th:style="${bg != null ? '--row-bg:' + bg : null}"
               th:data-id="${it.id()}" th:data-item="${itemJson.get(it.id())}">
      <td class="sel"><input type="checkbox" name="ids" form="bulk-form" th:value="${it.id()}" th:aria-label="${it.name()}"></td>
      <!-- Щелчок по названию открывает окно объекта (адрес ссылки — для открытия в новой вкладке) -->
      <td class="title" th:title="${it.name()}"><a class="edit-item" th:href="@{/items/{id}/edit(id=${it.id()},view=${view})}" th:text="${it.name()}"></a></td>
      <td class="c-platform" th:if="${fields.contains('platform')}" th:text="${it.platform()}"></td>
      <td class="c-format" th:if="${fields.contains('format')}" th:text="${it.format()}"></td>
      <td class="c-edition" th:if="${fields.contains('edition')}" th:text="${it.edition()}"></td>
      <td class="c-status" th:if="${fields.contains('status')}" th:text="${it.status()}"></td>
      <td class="rating c-rating" th:if="${fields.contains('rating')}"><span th:replace="~{base :: stars(${it.rating()})}"></span></td>
      <td class="num c-price" th:if="${fields.contains('price') and showPrices}"
          th:text="${it.price() == null ? '' : #numbers.formatInteger(it.price(), 1, 'WHITESPACE') + ' ₽'}"></td>
      <td class="eye c-price" th:if="${fields.contains('price') and !showPrices}">
        <span class="icon tip" tabindex="0" th:aria-label="#{field.price}" th:classappend="${it.price() == null} ? 'none'">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M600.5-379.5Q650-429 650-500t-49.5-120.5Q551-670 480-670t-120.5 49.5Q310-571 310-500t49.5 120.5Q409-330 480-330t120.5-49.5Zm-200-41Q368-453 368-500t32.5-79.5Q433-612 480-612t79.5 32.5Q592-547 592-500t-32.5 79.5Q527-388 480-388t-79.5-32.5ZM216-283Q98-366 40-500q58-134 176-217t264-83q146 0 264 83t176 217q-58 134-176 217t-264 83q-146 0-264-83Zm264-217Zm222.5 174.5Q804-391 857-500q-53-109-154.5-174.5T480-740q-121 0-222.5 65.5T102-500q54 109 155.5 174.5T480-260q121 0 222.5-65.5Z"/></svg>
          <span class="tiptext" th:text="${it.price() == null ? #messages.msg('price.none') : #messages.msg('price.tip', #numbers.formatInteger(it.price(), 1, 'WHITESPACE'))}"></span>
        </span>
      </td>
      <td class="date c-purchased" th:if="${fields.contains('purchased')}" th:text="${it.purchasedText()}"></td>
      <td class="flag c-available" th:if="${fields.contains('available')}">
        <span th:if="${it.available()}" class="avail yes" th:title="#{available.yes}" th:aria-label="#{available.yes}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg></span>
        <span th:unless="${it.available()}" class="avail no" th:title="#{available.no}" th:aria-label="#{available.no}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></span>
      </td>
      <td class="tags c-tags" th:if="${fields.contains('tags')}" th:title="${it.tags()}"><span class="tag" th:each="t : ${it.tagList()}" th:text="${t}"></span></td>
      <td class="pic-col"><span th:if="${it.hasImage()}" class="has-pic" th:title="#{coll.imageCount(${it.imageCount()})}" th:aria-label="#{coll.imageCount(${it.imageCount()})}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h600q24 0 42 18t18 42v600q0 24-18 42t-42 18H180Zm0-60h600v-600H180v600Zm56-97h489L578-473 446-302l-93-127-117 152Zm-56 97v-600 600Z"/></svg><span class="pic-n" th:text="${it.imageCount()}">1</span></span></td>
    </tr>
    </th:block>
    <tr th:if="${items.isEmpty()}"><td class="empty" th:colspan="${cols.size() + 2}" th:text="#{coll.nothingFoundHint}">Ничего не найдено. Измените или сбросьте фильтры.</td></tr>
    </tbody>
  </table>
  </th:block>

  <th:block th:replace="~{base :: itemDialog}"></th:block>
</main>
<script>
  // Массовые действия: выбор строк (Shift — диапазон), «выбрать все на странице», панель и значение для действия
  (function () {
    var form = document.getElementById('bulk-form');
    if (!form) return;
    var boxes = Array.prototype.slice.call(document.querySelectorAll('input[name=ids]')), all = document.getElementById('sel-all'), last = null;
    function sync() {
      var n = boxes.filter(function (b) { b.closest('tr').classList.toggle('picked', b.checked); return b.checked; }).length;
      document.getElementById('bulk-count').textContent = n;
      form.hidden = n === 0;
      all.checked = n > 0 && n === boxes.length; all.indeterminate = n > 0 && n < boxes.length;
    }
    boxes.forEach(function (b, i) {
      b.addEventListener('click', function (e) {
        if (e.shiftKey && last !== null) {
          var from = Math.min(last, i), to = Math.max(last, i);
          for (var k = from; k <= to; k++) boxes[k].checked = b.checked;
        }
        last = i; sync();
      });
    });
    all.addEventListener('change', function () { boxes.forEach(function (b) { b.checked = all.checked; }); sync(); });
    document.getElementById('bulk-clear').addEventListener('click', function () { boxes.forEach(function (b) { b.checked = false; }); sync(); });
    var action = document.getElementById('bulk-action');
    action.addEventListener('change', function () {
      form.querySelectorAll('select[data-for]').forEach(function (s) { var on = s.dataset.for === action.value; s.hidden = !on; s.disabled = !on; });
    });
    sync();
  })();
  // Ширина столбцов: потянуть за правый край заголовка. Запоминается в браузере (localStorage).
  (function () {
    var table = document.querySelector('table.items');
    if (!table) return;
    var key = 'colw:' + table.dataset.cols;
    var ths = Array.prototype.slice.call(table.querySelectorAll('thead tr.head th'));
    // Текущая ширина столбца с запасом на округление, чтобы текст не обрезался
    function width(th) { return Math.ceil(th.getBoundingClientRect().width) + 1; }
    // Ширина таблицы = сумма столбцов, чтобы менялся только тот столбец, который тянут
    function fitTable() {
      table.style.width = ths.reduce(function (sum, th) { return sum + parseInt(th.style.width, 10); }, 0) + 'px';
    }
    function fix(widths) {
      ths.forEach(function (th, i) { th.style.width = widths[i] + 'px'; });
      fitTable();
      table.classList.add('fixed');
    }
    function save() {
      try { localStorage.setItem(key, JSON.stringify(ths.map(function (th) { return parseInt(th.style.width, 10); }))); } catch (e) {}
    }
    try {
      var saved = JSON.parse(localStorage.getItem(key));
      if (saved && saved.length === ths.length) fix(saved);
    } catch (e) {}
    ths.forEach(function (th) {
      var grip = th.querySelector('.grip');
      if (!grip) return;
      grip.addEventListener('mousedown', function (e) {
        e.preventDefault();
        if (!table.classList.contains('fixed')) fix(ths.map(width));
        var startX = e.clientX, startW = parseInt(th.style.width, 10);
        document.body.classList.add('resizing');
        function move(ev) { th.style.width = Math.max(40, startW + ev.clientX - startX) + 'px'; fitTable(); }
        function up() {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          document.body.classList.remove('resizing');
          save();
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    });
    document.getElementById('reset-widths').addEventListener('click', function (e) {
      e.preventDefault();
      try { localStorage.removeItem(key); } catch (err) {}
      location.reload();
    });
  })();
</script>
</body>
</html>
