<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <a class="btn light back" th:href="${back}" title="Назад" aria-label="Назад"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <h2 th:text="${title}"></h2>
  </div>
  <form autocomplete="off" class="form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="view" th:if="${view != null}" th:value="${view}">
    <label for="f-name">Название *</label>
    <input autocomplete="off" id="f-name" type="text" name="name" required autofocus th:value="${obj != null ? obj.name() : ''}">

    <th:block th:unless="${isItem}">
      <label for="f-kind">Тип коллекции *</label>
      <select id="f-kind" name="kind" required>
        <option value="" th:selected="${obj == null or obj.kind() == null}" disabled>— выберите —</option>
        <option th:each="k : ${kinds}" th:value="${k}" th:text="${k}" th:selected="${obj != null and k == obj.kind()}"></option>
      </select>

      <label>Картинка</label>
      <div>
        <th:block th:if="${imgUrl != null}">
          <img class="preview" th:src="${imgUrl}" alt="">
          <label class="radio"><input type="checkbox" name="remove_image" value="1"> удалить картинку</label>
        </th:block>
        <input type="file" name="image" accept="image/*">
      </div>
    </th:block>

    <th:block th:if="${isItem and fields.contains('platform')}">
      <label for="f-platform">Платформа</label>
      <input autocomplete="off" id="f-platform" type="text" name="platform" th:value="${obj != null ? obj.platform() : ''}">
    </th:block>

    <th:block th:if="${isItem and fields.contains('format')}">
      <label for="f-format">Формат</label>
      <input autocomplete="off" id="f-format" type="text" name="format" th:value="${obj != null ? obj.format() : ''}">
    </th:block>

    <th:block th:if="${isItem and fields.contains('status')}">
      <label for="f-status">Статус прохождения</label>
      <input autocomplete="off" id="f-status" type="text" name="status" th:value="${obj != null ? obj.status() : ''}">
    </th:block>

    <th:block th:if="${isItem and fields.contains('price')}">
      <label for="f-price">Цена (₽)</label>
      <input autocomplete="off" id="f-price" type="number" name="price" min="0" step="1" th:value="${obj != null ? obj.price() : ''}">
    </th:block>

    <div class="full">
      <button class="btn">Сохранить</button>
      <a class="btn gray" th:href="${back}">Отмена</a>
    </div>
  </form>
</main>
</body>
</html>
