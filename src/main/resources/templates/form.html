<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <a class="btn light back" th:href="${back}" title="Назад" aria-label="Назад"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <h2 th:text="${title}"></h2>
  </div>
  <form autocomplete="off" class="form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="view" th:if="${view != null}" th:value="${view}">
    <label for="f-name">Название *</label>
    <input autocomplete="off" id="f-name" type="text" name="name" required autofocus th:value="${obj != null ? obj.name() : ''}">

    <th:block th:unless="${isItem}">
      <label for="f-kind">Тип коллекции *</label>
      <select id="f-kind" name="kind" required>
        <option value="" th:selected="${obj == null or obj.kind() == null}" disabled>— выберите —</option>
        <option th:each="k : ${kinds}" th:value="${k}" th:text="${k}" th:selected="${obj != null and k == obj.kind()}"></option>
      </select>

      <label>Картинка</label>
      <div>
        <th:block th:if="${imgUrl != null}">
          <img class="preview" th:src="${imgUrl}" alt="">
          <label class="radio"><input type="checkbox" name="remove_image" value="1"> удалить картинку</label>
        </th:block>
        <input type="file" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
      </div>
    </th:block>

    <th:block th:if="${isItem and fields.contains('platform')}">
      <label for="f-platform">Платформа</label>
      <input autocomplete="off" id="f-platform" type="text" name="platform" th:value="${obj != null ? obj.platform() : ''}">
    </th:block>

    <th:block th:if="${isItem and fields.contains('format')}">
      <label for="f-format">Формат</label>
      <input autocomplete="off" id="f-format" type="text" name="format" th:value="${obj != null ? obj.format() : ''}">
    </th:block>

    <th:block th:if="${isItem and fields.contains('status')}">
      <label for="f-status">Статус прохождения</label>
      <select id="f-status" name="status" th:with="cur=${obj != null and obj.status() != null ? obj.status() : ''}">
        <option value="">—</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == cur}"></option>
        <!-- старое значение не из списка — отдельным пунктом, чтобы не потерялось -->
        <option th:if="${!cur.isEmpty() and !statuses.contains(cur)}" th:value="${cur}" th:text="${cur}" selected></option>
      </select>
    </th:block>

    <th:block th:if="${isItem and fields.contains('rating')}">
      <label>Рейтинг</label>
      <span th:replace="~{base :: ratingInput('f-rating', ${obj != null ? obj.rating() : null})}"></span>
    </th:block>

    <th:block th:if="${isItem and fields.contains('price')}">
      <label for="f-price">Цена (₽)</label>
      <input autocomplete="off" id="f-price" type="number" name="price" min="0" step="1" th:value="${obj != null ? obj.price() : ''}">
    </th:block>

    <th:block th:if="${isItem and fields.contains('available')}">
      <label for="f-available">Наличие</label>
      <!-- скрытое 0 + галочка 1: так сервер отличает «снята» от «поля нет в форме»; у нового объекта — снята («Нет») -->
      <span><input type="hidden" name="available" value="0"><label class="radio"><input id="f-available" type="checkbox" name="available" value="1"
             th:checked="${obj != null and obj.available()}"> есть</label></span>
    </th:block>

    <th:block th:if="${isItem}">
      <label class="at-field" for="f-description">Описание</label>
      <textarea autocomplete="off" id="f-description" name="description" rows="8" maxlength="5000" th:text="${obj != null ? obj.description() : ''}"></textarea>
    </th:block>

    <th:block th:if="${isItem}">
      <label>Картинка</label>
      <div>
        <th:block th:if="${imgUrl != null}">
          <a th:href="${imgUrl}" target="_blank" title="Открыть в полном размере"><img class="preview" th:src="${imgUrl}" alt=""></a>
          <label class="radio"><input type="checkbox" name="remove_image" value="1"> удалить картинку</label>
        </th:block>
        <input type="file" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
      </div>
    </th:block>

    <div class="full">
      <button class="btn">Сохранить</button>
      <a class="btn gray" th:href="${back}">Отмена</a>
      <!-- Удаление объекта (в таблице корзин нет) -->
      <button type="submit" class="btn light danger" th:if="${isItem and obj != null}" formnovalidate
              th:formaction="@{/items/{id}/delete(id=${obj.id()})}" onclick="return confirm('Удалить объект?')">Удалить объект</button>
    </div>
  </form>
  <script th:if="${isItem and fields.contains('rating')}" th:replace="~{base :: ratingScript}"></script>
</main>
</body>
</html>
