<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <!-- Форма коллекции (новая и изменение). Объекты меняются только в окне объекта (base :: itemDialog) -->
  <div class="bar">
    <a class="btn light back" th:href="${back}" th:title="#{nav.back}" th:aria-label="#{nav.back}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <h2 th:text="#{${title}}"></h2>
  </div>
  <form autocomplete="off" class="form" method="post" enctype="multipart/form-data">
    <label for="f-name" th:text="#{field.name} + ' *'">Название *</label>
    <input autocomplete="off" spellcheck="false" id="f-name" type="text" name="name" required autofocus th:value="${obj != null ? obj.name() : ''}">

    <label for="f-kind" th:text="#{kinds.kind} + ' *'">Тип коллекции *</label>
    <select id="f-kind" name="kind" required>
      <option value="" th:selected="${obj == null or obj.kind() == null}" disabled th:text="#{form.choose}">— выберите —</option>
      <option th:each="k : ${kinds}" th:value="${k}" th:text="${k}" th:selected="${obj != null and k == obj.kind()}"></option>
    </select>

    <label th:text="#{field.image}">Картинка</label>
    <div>
      <th:block th:if="${imgUrl != null}">
        <img class="preview" th:src="${imgUrl + '/thumb'}" alt="">
        <label class="radio"><input type="checkbox" name="remove_image" value="1"> <span th:text="#{image.removeLower}">удалить картинку</span></label>
      </th:block>
      <input type="file" name="image" accept="image/png,image/jpeg,image/gif">
    </div>

    <div class="full">
      <button class="btn" th:text="#{btn.save}">Сохранить</button>
      <a class="btn gray" th:href="${back}" th:text="#{btn.cancel}">Отмена</a>
    </div>
  </form>
</main>
</body>
</html>
