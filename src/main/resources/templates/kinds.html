<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('kinds')}"></th:block>
  <div class="bar">
    <span class="muted" th:text="#{kinds.text}"></span>
    <span class="spacer"></span>
    <a class="btn" href="/kinds/new"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></svg><span th:text="#{kinds.new}">Новый тип</span></a>
  </div>
  <p class="empty" th:if="${kinds.isEmpty()}" th:text="#{kinds.none}">Типов пока нет.</p>
  <table class="items" th:unless="${kinds.isEmpty()}">
    <thead><tr>
      <th th:text="#{kinds.kind}">Тип коллекции</th>
      <th th:text="#{kinds.fields}">Поля объектов</th>
      <th th:text="#{kinds.colors}">Цвета статусов</th>
      <th th:text="#{kinds.used}">Коллекций</th>
      <th class="actions"></th>
    </tr></thead>
    <tbody><tr th:each="k : ${kinds}">
      <td th:text="${k.name()}"></td>
      <td class="title" th:text="${#messages.msg('field.name') + (k.fields().isEmpty() ? '' : ', ' + #strings.listJoin(k.fields().![#messages.msg('field.' + #this)], ', '))}"></td>
      <td>
        <span class="swatch" th:each="e : ${k.statusColors()}" th:style="${'background:' + e.value}" th:text="${e.key}"></span>
      </td>
      <td th:text="${k.used()}"></td>
      <td class="actions">
        <a class="icon" th:title="#{btn.edit}" th:aria-label="#{btn.edit}" th:href="@{/kinds/{id}/edit(id=${k.id()})}">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-180h44l472-471-44-44-472 471v44Zm-60 60v-128l575-574q8-8 19-12.5t23-4.5q11 0 22 4.5t20 12.5l44 44q9 9 13 20t4 22q0 11-4.5 22.5T823-694L248-120H120Zm659-617-41-41 41 41Zm-105 64-22-22 44 44-22-22Z"/></svg>
        </a>
        <form autocomplete="off" class="inline" method="post" th:action="@{/kinds/{id}/delete(id=${k.id()})}" th:if="${k.used() == 0}"
              th:data-confirm="#{kinds.deleteConfirm}" onsubmit="return appConfirm(event, this.dataset.confirm)">
          <button class="icon red" th:title="#{js.delete}" th:aria-label="#{js.delete}">
            <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-41v-60h188v-30h264v30h188v60h-41v570q0 24-18 42t-42 18H261Zm438-630H261v570h438v-570ZM367-266h60v-399h-60v399Zm166 0h60v-399h-60v399ZM261-750v570-570Z"/></svg>
          </button>
        </form>
        <span class="icon disabled" th:unless="${k.used() == 0}" th:title="#{kinds.cannotDelete}">
          <svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-41v-60h188v-30h264v30h188v60h-41v570q0 24-18 42t-42 18H261Zm438-630H261v570h438v-570ZM367-266h60v-399h-60v399Zm166 0h60v-399h-60v399ZM261-750v570-570Z"/></svg>
        </span>
      </td>
    </tr></tbody>
  </table>

</main>
</body>
</html>
