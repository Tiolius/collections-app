<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('import')}"></th:block>
  <h3 class="section" th:text="#{import.title}">Картинки и описания объектов из Steam, GOG, Nintendo eShop, LaunchBox, Discogs или FantLab</h3>
  <!-- Импорт идёт: прогресс обновляется скриптом из /import/status -->
  <div class="import-box" id="import-job" th:if="${job != null and job.active()}">
    <div><b th:text="${job.collectionName}"></b> (<span th:text="${job.sourceName()}"></span>) — <span id="ij-state" th:text="#{${job.state == 'queued' ? 'js.importQueued' : 'js.importRunning'}}"></span></div>
    <progress id="ij-bar" th:max="${job.total == 0 ? 1 : job.total}" th:value="${job.processed}"></progress>
    <div><span th:text="#{import.processed}">Обработано</span> <span id="ij-processed" th:text="${job.processed}"></span> <span th:text="#{cache.of}">из</span> <span th:text="${job.total}"></span>
      · <span th:text="#{import.found}">найдено</span> <span id="ij-found" th:text="${job.found}"></span>
      · <span th:text="#{import.notFound}">не найдено</span> <span id="ij-notfound" th:text="${job.notFound}"></span>
      · <span th:text="#{import.errors}">ошибок</span> <span id="ij-errors" th:text="${job.errors}"></span></div>
    <div class="muted" id="ij-current" th:text="${job.current}"></div>
    <div class="muted" id="ij-message" th:text="${job.message}" th:hidden="${#strings.isEmpty(job.message)}"></div>
    <form autocomplete="off" method="post" action="/import/cancel"><button class="btn gray" th:text="#{import.stop}">Остановить</button></form>
  </div>

  <!-- Итог последнего импорта -->
  <th:block th:if="${job != null and !job.active()}">
    <p th:class="${job.state == 'failed' ? 'error' : 'ok'}">
      <span th:text="${job.state == 'done' ? #messages.msg('import.done') : job.state == 'cancelled' ? #messages.msg('import.cancelled') : job.message}"></span>
      (<span th:text="${job.collectionName + ', ' + job.sourceName()}"></span>): <span th:text="#{import.foundOf}">найдено —</span> <b th:text="${job.found}"></b>
      <span th:text="#{cache.of}">из</span> <span th:text="${job.total}"></span><span th:if="${job.processed < job.total}" th:text="${' ' + #messages.msg('import.processedCount', job.processed)}"></span>,
      <span th:text="#{import.notFoundOf}">не найдено —</span> <span th:text="${job.notFound}"></span><span th:if="${job.errors > 0}" th:text="${', ' + #messages.msg('import.errorsCount', job.errors)}"></span>.
    </p>
  </th:block>

  <form autocomplete="off" class="form" method="post" action="/import/start" th:unless="${job != null and job.active()}">
    <label for="f-coll" th:text="#{cache.collection}">Коллекция</label>
    <select id="f-coll" name="collection" required>
      <option th:each="c : ${collections}" th:value="${c.id()}" th:text="${c.name() + ' (' + c.count() + ')'}"
              th:selected="${job != null and job.collectionId == c.id()}"></option>
    </select>

    <label for="f-source"><span th:text="#{import.source}">Источник</span>
      <!-- Справка об источниках: всплывает при наведении или по нажатию (фокус) -->
      <span class="icon tip help" tabindex="0" th:aria-label="#{import.sourceHelp}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
        <span class="tiptext">
          <span><b>Steam</b> — <th:block th:text="#{import.help.steam}"></th:block></span>
          <span><b>GOG</b> — <th:block th:text="#{import.help.gog}"></th:block></span>
          <span><b>Nintendo eShop</b> — <th:block th:text="#{import.help.nintendo}"></th:block></span>
          <span><b>LaunchBox</b> — <th:block th:text="#{import.help.launchbox}"></th:block></span>
          <span><b>Discogs</b> — <th:block th:text="#{import.help.discogs}"></th:block></span>
          <span><b>FantLab</b> — <th:block th:text="#{import.help.fantlab}"></th:block></span>
          <span th:text="#{import.help.speed}"></span>
          <span th:text="#{import.help.count}"></span>
        </span>
      </span>
    </label>
    <div>
      <select id="f-source" name="source">
        <option value="steam" th:text="|Steam (#{import.games})|" th:selected="${job != null and job.source == 'steam'}">Steam (игры)</option>
        <option value="gog" th:text="|GOG (#{import.games})|" th:selected="${job != null and job.source == 'gog'}">GOG (игры)</option>
        <option value="nintendo" th:text="|Nintendo eShop (#{import.games})|" th:selected="${job != null and job.source == 'nintendo'}">Nintendo eShop (игры)</option>
        <option value="launchbox" th:text="|LaunchBox (#{import.consoleGames})|" th:selected="${job != null and job.source == 'launchbox'}">LaunchBox (игры для консолей)</option>
        <option value="discogs" th:text="|Discogs (#{import.music})|" th:selected="${job != null and job.source == 'discogs'}">Discogs (музыка)</option>
        <option value="fantlab" th:text="|FantLab (#{import.books})|" th:selected="${job != null and job.source == 'fantlab'}">FantLab (книги)</option>
      </select>
      <div class="muted" id="f-notoken" th:unless="${discogsReady}" th:text="#{import.noToken}"></div>
    </div>

    <label th:text="#{import.load}">Загружать</label>
    <div>
      <label class="radio"><input type="checkbox" name="loadImages" value="true" id="f-images" checked th:attr="data-discogs-ready=${discogsReady}"> <span th:text="#{import.images}">картинки</span></label>
      <label class="radio"><input type="checkbox" name="loadDescriptions" value="true" id="f-descr" checked> <span th:text="#{import.descriptions}">описания</span></label>
    </div>

    <label for="f-count" th:text="#{import.count}">Картинок на объект</label>
    <div>
      <!-- сколько картинок загружать, если у источника их несколько (скриншоты Steam, картинки альбома Discogs, обложки изданий FantLab) -->
      <select id="f-count" name="imageCount" class="narrow">
        <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="#{import.upTo(${n})}" th:selected="${n == 5}"></option>
      </select>
    </div>

    <label th:text="#{import.first}">Первая картинка</label>
    <div>
      <!-- для игр (Steam, GOG, Nintendo eShop, LaunchBox): с чего начинать картинки объекта -->
      <label class="radio"><input type="radio" name="steamImage" value="screenshot" checked> <span th:text="#{import.screenshot}">скриншот</span></label>
      <label class="radio"><input type="radio" name="steamImage" value="header"> <span th:text="#{import.header}">шапка страницы игры (Steam) / обложка коробки (остальные)</span></label>
    </div>

    <span></span>
    <label class="radio"><input type="checkbox" name="onlyMissing" value="true" checked> <span th:text="#{import.onlyMissing}">не заменять уже заполненные картинки и описания</span></label>

    <div class="full"><button class="btn" th:disabled="${collections.isEmpty()}" th:text="#{import.start}">Загрузить</button></div>
  </form>

  <!-- Личный токен Discogs: у каждого пользователя свой; сам токен на страницу не выводится -->
  <h3 class="section" th:text="#{import.token.title}">Токен Discogs</h3>
  <p class="ok" th:if="${param.token != null and param.token[0] == 'saved'}" th:text="#{import.token.saved}">Токен Discogs сохранён.</p>
  <p class="ok" th:if="${param.token != null and param.token[0] == 'deleted'}" th:text="#{import.token.deleted}">Токен Discogs удалён.</p>
  <form autocomplete="off" class="form" method="post" action="/import/discogs-token">
    <label for="f-token"><span th:text="#{import.token}">Токен</span>
      <span class="icon tip help" tabindex="0" th:aria-label="#{import.token.help}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
        <span class="tiptext">
          <span th:text="#{import.token.help1}"></span>
          <span th:text="#{import.token.help2}"></span>
          <span th:text="#{import.token.help3}"></span>
        </span>
      </span>
    </label>
    <div>
      <input type="password" id="f-token" name="token" autocomplete="new-password" maxlength="200" required
             th:placeholder="${discogsReady ? #messages.msg('import.token.savedHint', discogsTokenEnd) : #messages.msg('import.token.none')}">
    </div>
    <div class="full split">  <!-- «Сохранить» слева, «Удалить токен» — у правого края формы -->
      <button class="btn" th:text="#{btn.save}">Сохранить</button>
      <button class="btn light danger" name="delete" value="true" th:if="${discogsReady}" formnovalidate th:text="#{import.token.delete}">Удалить токен</button>
    </div>
  </form>

<script>
  // Discogs без токена отдаёт только описания: галочка «картинки» для него неактивна, под списком — подсказка про токен
  (function () {
    var img = document.getElementById('f-images');
    if (!img || img.dataset.discogsReady === 'true') return;
    function sync() {
      var discogs = document.getElementById('f-source').value === 'discogs';
      img.disabled = discogs;
      document.getElementById('f-notoken').hidden = !discogs;
    }
    document.getElementById('f-source').addEventListener('change', sync);
    sync();
  })();
  // Выбор «скриншот / шапка (обложка)» — только для игр и когда загружаются картинки
  (function () {
    var img = document.getElementById('f-images');
    if (!img) return;
    function sync() {
      var src = document.getElementById('f-source').value, steam = ['steam', 'gog', 'nintendo', 'launchbox'].indexOf(src) >= 0;
      document.querySelectorAll('input[name=steamImage]').forEach(function (r) { r.disabled = !steam || !img.checked || img.disabled; });
      document.getElementById('f-count').disabled = !img.checked || img.disabled;
    }
    document.getElementById('f-source').addEventListener('change', sync);
    img.addEventListener('change', sync);
    sync();
  })();
</script>
<script th:if="${job != null and job.active()}">
  // Прогресс импорта: раз в секунду спрашиваем состояние; когда импорт закончится — перезагружаем страницу (итог)
  (function () {
    function $(id) { return document.getElementById(id); }
    function tick() {
      fetch('/import/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
        if (s.state !== 'queued' && s.state !== 'running') { location.reload(); return; }
        $('ij-state').textContent = s.state === 'queued' ? T.importQueued : T.importRunning;
        $('ij-bar').max = Math.max(s.total, 1); $('ij-bar').value = s.processed;
        $('ij-processed').textContent = s.processed; $('ij-found').textContent = s.found;
        $('ij-notfound').textContent = s.notFound; $('ij-errors').textContent = s.errors;
        $('ij-current').textContent = s.current;
        $('ij-message').textContent = s.message; $('ij-message').hidden = !s.message;
        setTimeout(tick, 1000);
      }).catch(function () { setTimeout(tick, 3000); });
    }
    setTimeout(tick, 1000);
  })();
</script>
</main>
</body>
</html>
