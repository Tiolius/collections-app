<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('account')}"></th:block>
  <p class="ok" th:if="${param.passwordChanged != null}" th:text="#{account.changed}">Пароль изменён.</p>
  <p class="error" th:if="${passwordError != null}" th:text="${passwordError}"></p>
  <form autocomplete="off" class="form" method="post" action="/account/password">
    <label for="f-cur" th:text="#{account.current}">Текущий пароль</label>
    <input id="f-cur" type="password" name="current" autocomplete="new-password">

    <label class="at-field" for="f-new" th:text="#{account.new}">Новый пароль</label>
    <div>
      <input id="f-new" type="password" name="password" autocomplete="new-password">
      <div th:replace="~{base :: passwordHint}"></div>
    </div>

    <label for="f-new2" th:text="#{account.new2}">Повторите новый пароль</label>
    <input id="f-new2" type="password" name="password2" autocomplete="new-password">

    <div class="full"><button class="btn" th:text="#{account.change}">Сменить пароль</button></div>
  </form>

</main>
</body>
</html>
