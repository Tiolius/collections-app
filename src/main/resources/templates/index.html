<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <h2>Мои коллекции</h2>
    <a class="btn" href="/collections/new">+ Новая коллекция</a>
  </div>
  <p class="empty" th:if="${collections.isEmpty()}">Пока нет ни одной коллекции.</p>
  <div class="grid">
    <div class="card" th:each="c : ${collections}">
      <a class="card-link" th:href="@{/collections/{id}(id=${c.id()})}">
        <img th:if="${c.hasImage()}" th:src="@{/collections/{id}/image(id=${c.id()})}" alt="">
        <div th:unless="${c.hasImage()}" class="noimg">нет картинки</div>
        <div class="body">
          <div class="name" th:text="${c.name()}"></div>
          <div class="type" th:text="${(c.type() == null or c.type().isEmpty() ? '—' : c.type()) + ' · объектов: ' + c.count()}"></div>
        </div>
      </a>
    </div>
  </div>
</main>
</body>
</html>
