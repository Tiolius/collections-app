<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <h2 th:text="#{index.title}">Мои коллекции</h2>
    <span class="pager pages" th:if="${pages > 1}">
      <th:block th:each="p : ${pageLinks}">
        <span th:if="${p == 0}" class="muted">…</span>
        <b th:if="${p == page}" th:text="${p}"></b>
        <a th:if="${p != 0 and p != page}" th:text="${p}" th:href="@{/(page=${p})}"></a>
      </th:block>
    </span>
    <span class="spacer"></span>
    <a class="icon big" href="/stats" th:title="#{stats.title}" th:aria-label="#{stats.title}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M660-160v-280h140v280H660Zm-250 0v-640h140v640H410Zm-250 0v-440h140v440H160Z"/></svg></a>
    <a class="icon big add" href="/collections/new" th:title="#{coll.new}" th:aria-label="#{coll.new}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M550-320h60v-90h90v-60h-90v-90h-60v90h-90v60h90v90ZM140-160q-24 0-42-18.5T80-220v-520q0-23 18-41.5t42-18.5h281l60 60h339q23 0 41.5 18.5T880-680v460q0 23-18.5 41.5T820-160H140Zm0-60h680v-460H456l-60-60H140v520Zm0 0v-520 520Z"/></svg></a>
  </div>
  <p class="empty" th:if="${collections.isEmpty()}" th:text="#{index.empty}">Пока нет ни одной коллекции.</p>
  <div class="list">
    <a class="row" th:each="c : ${collections}" th:href="@{/collections/{id}(id=${c.id()})}">
      <img class="thumb" th:if="${c.hasImage()}" th:src="@{/img/{h}/thumb(h=${c.pic()})}" alt="">
      <div class="thumb" th:unless="${c.hasImage()}"></div>
      <div>
        <div class="name" th:text="${c.name()}"></div>
        <div class="type" th:text="${c.kind() == null ? '—' : c.kind()}"></div>
        <!-- Счётчики: всего; в наличии и стоимость — если у типа есть эти поля (стоимость скрыта настройкой — в подсказке у глаза) -->
        <div class="muted meta-line stats" th:with="f=${kindFields.get(c.id())}">
          <span th:text="#{index.total(${c.count()})}"></span>
          <th:block th:if="${f.contains('available')}"><span class="sep">·</span> <span th:text="#{index.available(${availableCounts.get(c.id())})}"></span></th:block>
          <th:block th:if="${f.contains('price') and showPrices}"><span class="sep">·</span> <span th:text="#{coll.value(${prices.get(c.id())})}"></span></th:block>
          <th:block th:if="${f.contains('price') and !showPrices}"><span class="sep">·</span>
            <span class="icon tip right small" th:aria-label="#{coll.valueLabel}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M600.5-379.5Q650-429 650-500t-49.5-120.5Q551-670 480-670t-120.5 49.5Q310-571 310-500t49.5 120.5Q409-330 480-330t120.5-49.5Zm-200-41Q368-453 368-500t32.5-79.5Q433-612 480-612t79.5 32.5Q592-547 592-500t-32.5 79.5Q527-388 480-388t-79.5-32.5ZM216-283Q98-366 40-500q58-134 176-217t264-83q146 0 264 83t176 217q-58 134-176 217t-264 83q-146 0-264-83Zm264-217Zm222.5 174.5Q804-391 857-500q-53-109-154.5-174.5T480-740q-121 0-222.5 65.5T102-500q54 109 155.5 174.5T480-260q121 0 222.5-65.5Z"/></svg>
              <span class="tiptext" th:text="#{coll.valueTip(${prices.get(c.id())})}"></span>
            </span>
          </th:block>
        </div>
      </div>
    </a>
  </div>
</main>
</body>
</html>
