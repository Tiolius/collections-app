<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <h2>Мои коллекции</h2>
    <a class="btn" href="/collections/new">+ Новая коллекция</a>
  </div>
  <p class="empty" th:if="${collections.isEmpty()}">Пока нет ни одной коллекции.</p>
  <div class="list">
    <a class="row" th:each="c : ${collections}" th:href="@{/collections/{id}(id=${c.id()})}">
      <img class="thumb" th:if="${c.hasImage()}" th:src="@{/collections/{id}/image(id=${c.id()})}" alt="">
      <div class="thumb" th:unless="${c.hasImage()}"></div>
      <div>
        <div class="name" th:text="${c.name()}"></div>
        <div class="type" th:text="${c.type() == null or c.type().isEmpty() ? '—' : c.type()}"></div>
      </div>
    </a>
  </div>
</main>
</body>
</html>
