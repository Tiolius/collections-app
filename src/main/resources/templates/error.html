<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<!-- Страница ошибки: без технических подробностей; message — только наш текст (см. ErrorPages) -->
<main th:with="s=${status == null ? 500 : status}">
  <h2 th:text="${#messages.msg(s == 404 ? 'error.404' : s == 403 ? 'error.403' : s == 413 ? 'error.413'
               : s >= 400 and s < 500 ? 'error.4xx' : 'error.500')}"></h2>
  <p class="error" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}"></p>
  <p class="muted" th:unless="${message != null and !#strings.isEmpty(message)}"
     th:text="${#messages.msg(s == 404 ? 'error.404.text' : s == 403 ? 'error.403.text' : s == 413 ? 'error.413.text'
             : s >= 400 and s < 500 ? 'error.4xx.text' : 'error.500.text')}"></p>
  <div class="bar">
    <button type="button" class="btn gray" onclick="history.back()" th:text="#{nav.back}">Назад</button>
    <a class="btn" href="/" th:text="#{error.home}">На главную</a>
  </div>
</main>
</body>
</html>
