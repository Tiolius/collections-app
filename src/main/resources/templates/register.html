<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="auth">
  <h2>Регистрация</h2>
  <p class="error" th:if="${error != null}" th:text="${error}"></p>
  <form class="form" method="post">
    <label for="f-name">Имя пользователя</label>
    <input id="f-name" type="text" name="name" required autofocus autocomplete="username" th:value="${name}">

    <label for="f-pw">Пароль</label>
    <input id="f-pw" type="password" name="password" autocomplete="new-password">

    <label for="f-pw2">Повторите пароль</label>
    <input id="f-pw2" type="password" name="password2" autocomplete="new-password">
    <div class="full"><button class="btn">Зарегистрироваться</button></div>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="/login">Войти</a></p>
</main>
</body>
</html>
