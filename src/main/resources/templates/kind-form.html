<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <a class="btn light back" href="/kinds" th:title="#{nav.back}" th:aria-label="#{nav.back}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <h2 th:text="#{${title}}"></h2>
  </div>
  <!-- Removing a field from a type in use deletes the values of this field from items — with confirmation -->
  <form autocomplete="off" class="form kind-form" method="post" id="kind-form"
        th:data-used="${kind != null ? kind.used() : 0}" th:data-confirm="#{kinds.dropConfirm}" th:data-ok="#{btn.save}">
    <label for="f-name" th:text="#{kinds.name} + ' *'">Название типа *</label>
    <input autocomplete="off" id="f-name" type="text" name="name" required autofocus th:value="${kind != null ? kind.name() : ''}">

    <label for="f-profile"><span th:text="#{kinds.profile}">Профиль</span> <span th:replace="~{base :: info(#{kinds.profileHint})}"></span></label>
    <select id="f-profile" name="profile" class="narrow" autocomplete="off">
      <option th:each="p : ${profiles}" th:value="${p.key}" th:text="#{${p.value}}"
              th:selected="${kind != null ? kind.profile() == p.key : p.key == 'other'}"></option>
    </select>

    <!-- Fields: tick — the type has the field; own label (empty — standard); arrows — order of fields in the item window and table columns.
         Row order = field order; each row has exactly one role, label, type, opts (built-in fields have empty type and opts).
         Custom fields: role "c<id>" (kind does not change) or "n<number>" (new, kind is chosen); list values — one per line -->
    <label class="top"><span th:text="#{kinds.fields}">Поля объектов</span> <span th:replace="~{base :: info(#{kinds.fieldsHint})}"></span></label>
    <div>
      <table class="kind-fields">
        <thead><tr><th></th><th th:text="#{kinds.field}">Поле</th><th th:text="#{kinds.ownLabel}">Своя подпись</th><th></th></tr></thead>
        <tbody>
          <tr class="fixed"><td><input type="checkbox" checked disabled></td><td th:text="#{field.name}">Название</td><td></td><td></td></tr>
        </tbody>
        <tbody id="kind-field-rows">
          <tr th:each="r : ${rows}" th:data-was-on="${r.on() and kind != null ? '1' : ''}" th:classappend="${r.custom()} ? 'custom'">
            <td><input type="checkbox" name="on" th:value="${r.role()}" th:checked="${r.on()}" th:id="${'f-on-' + r.role()}"
                       th:aria-label="${r.custom() ? r.label() : r.defaultLabel()}"></td>
            <td th:unless="${r.custom()}"><label th:for="${'f-on-' + r.role()}" th:text="${r.defaultLabel()}"></label>
              <input type="hidden" name="role" th:value="${r.role()}"><input type="hidden" name="type" value=""><input type="hidden" name="opts" value=""></td>
            <td th:unless="${r.custom()}"><input type="text" name="label" autocomplete="off" maxlength="60" th:value="${r.label()}" th:placeholder="${r.defaultLabel()}" th:aria-label="#{kinds.ownLabel}"></td>
            <!-- custom field: kind (does not change after creation) and label; a list also has values -->
            <td th:if="${r.custom()}"><input type="hidden" name="role" th:value="${r.role()}"><input type="hidden" name="type" th:value="${r.type()}">
              <select disabled th:aria-label="#{kinds.type}"><option th:each="t : ${customTypes}" th:value="${t.key}" th:text="#{${t.value}}" th:selected="${t.key == r.type()}"></option></select></td>
            <td th:if="${r.custom()}" class="custom-cell"><input type="text" name="label" autocomplete="off" maxlength="60" th:value="${r.label()}" th:placeholder="#{kinds.customLabel}" th:aria-label="#{kinds.customLabel}">
              <textarea name="opts" rows="3" autocomplete="off" th:hidden="${r.type() != 'select'}" th:placeholder="#{kinds.optionsPlaceholder}" th:aria-label="#{kinds.options}" th:text="${r.opts()}"></textarea></td>
            <td class="moves">
              <button type="button" class="icon move-up" th:title="#{kinds.up}" th:aria-label="#{kinds.up}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M450-160v-526L222-458l-42-42 300-300 300 300-42 42-228-228v526h-60Z"/></svg></button>
              <button type="button" class="icon move-down" th:title="#{kinds.down}" th:aria-label="#{kinds.down}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M450-800v526L222-502l-42 42 300 300 300-300-42-42-228 228v-526h-60Z"/></svg></button>
            </td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn gray" id="add-field" th:data-max="${maxCustom}" th:text="#{kinds.addField}">Добавить поле</button>
      <!-- New custom field: a template row (the script sets role n<number>) -->
      <template id="new-field">
        <tr class="custom">
          <td><input type="checkbox" name="on" checked th:aria-label="#{kinds.customLabel}"></td>
          <td><input type="hidden" name="role">
            <select name="type" th:aria-label="#{kinds.type}"><option th:each="t : ${customTypes}" th:value="${t.key}" th:text="#{${t.value}}"></option></select></td>
          <td class="custom-cell"><input type="text" name="label" autocomplete="off" maxlength="60" required th:placeholder="#{kinds.customLabel}" th:aria-label="#{kinds.customLabel}">
            <textarea name="opts" rows="3" autocomplete="off" hidden th:placeholder="#{kinds.optionsPlaceholder}" th:aria-label="#{kinds.options}"></textarea></td>
          <td class="moves">
            <button type="button" class="icon move-up" th:title="#{kinds.up}" th:aria-label="#{kinds.up}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M450-160v-526L222-458l-42-42 300-300 300 300-42 42-228-228v526h-60Z"/></svg></button>
            <button type="button" class="icon move-down" th:title="#{kinds.down}" th:aria-label="#{kinds.down}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M450-800v526L222-502l-42 42 300 300 300-300-42-42-228 228v-526h-60Z"/></svg></button>
          </td>
        </tr>
      </template>
    </div>

    <!-- Statuses (values of the "Status" field): in order; an empty line is not saved; item row colour — if ticked -->
    <label class="top"><span th:text="#{kinds.statuses}">Статусы</span> <span th:replace="~{base :: info(#{kinds.statusesHint})}"></span></label>
    <div>
      <table class="status-colors" id="status-rows" th:data-max="${maxStatuses}">
        <thead><tr><th th:text="#{field.statusShort}">Статус</th><th th:text="#{kinds.rowColor}">Цвет строки</th></tr></thead>
        <tbody>
          <tr th:each="o : ${statusRows}">
            <td><input type="text" name="st" autocomplete="off" maxlength="60" th:value="${o.value()}" th:aria-label="#{field.statusShort}"></td>
            <td class="color-cell">
              <input type="hidden" name="stc" th:value="${o.color() == null ? '' : o.color()}">
              <label class="radio"><input type="checkbox" class="use-color" th:checked="${o.color() != null}" th:aria-label="#{kinds.rowColor}"></label>
              <input type="color" class="pick-color" th:value="${o.color() == null ? '#fefcbf' : o.color()}" th:aria-label="#{kinds.color}">
            </td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn gray" id="add-status" th:text="#{kinds.addStatus}">Добавить статус</button>
    </div>

    <p class="full muted" style="margin:0" th:if="${kind != null and kind.used() > 0}"
       th:text="#{kinds.usedHint(${kind.used()})}"></p>

    <div class="full">
      <button class="btn" th:text="#{btn.save}">Сохранить</button>
      <a class="btn gray" href="/kinds" th:text="#{btn.cancel}">Отмена</a>
    </div>
  </form>
</main>
<script>
  (function () {
    var form = document.getElementById('kind-form');
    // Field order — with the arrows
    document.getElementById('kind-field-rows').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      var tr = b.closest('tr');
      if (b.classList.contains('move-up') && tr.previousElementSibling) tr.parentNode.insertBefore(tr, tr.previousElementSibling);
      if (b.classList.contains('move-down') && tr.nextElementSibling) tr.parentNode.insertBefore(tr.nextElementSibling, tr);
      b.focus();
    });
    // Custom field: a new one — from the template row (role n<number>, ticked); list values are visible only for the "list" kind
    var fieldRows = document.getElementById('kind-field-rows'), addField = document.getElementById('add-field'), n = 0;
    function customCount() { return fieldRows.querySelectorAll('tr.custom').length; }
    addField.addEventListener('click', function () {
      var tr = document.getElementById('new-field').content.firstElementChild.cloneNode(true), key = 'n' + (++n);
      tr.querySelector('input[name=role]').value = key;
      tr.querySelector('input[name=on]').value = key;
      fieldRows.appendChild(tr);
      addField.disabled = customCount() >= +addField.dataset.max;
      tr.querySelector('input[name=label]').focus();
    });
    addField.disabled = customCount() >= +addField.dataset.max;
    fieldRows.addEventListener('change', function (e) {
      // a new field that was unticked — just remove the row
      if (e.target.name === 'on' && !e.target.checked && /^n/.test(e.target.value)) {
        e.target.closest('tr').remove();
        addField.disabled = customCount() >= +addField.dataset.max;
        return;
      }
      if (e.target.name !== 'type') return;
      var opts = e.target.closest('tr').querySelector('textarea[name=opts]');
      opts.hidden = e.target.value !== 'select';
      opts.required = e.target.value === 'select';
    });
    // Row colour: sent in the hidden stc only if the tick is set
    var rows = document.querySelector('#status-rows tbody');
    function sync(tr) {
      var use = tr.querySelector('.use-color'), pick = tr.querySelector('.pick-color');
      pick.disabled = !use.checked;
      tr.querySelector('input[name=stc]').value = use.checked ? pick.value : '';
    }
    rows.addEventListener('input', function (e) { sync(e.target.closest('tr')); });
    rows.addEventListener('change', function (e) { sync(e.target.closest('tr')); });
    rows.querySelectorAll('tr').forEach(sync);
    // A new status row — a copy of the last one, empty
    var add = document.getElementById('add-status'), max = +document.getElementById('status-rows').dataset.max;
    function addState() { add.disabled = rows.rows.length >= max; }
    add.addEventListener('click', function () {
      var tr = rows.rows[rows.rows.length - 1].cloneNode(true);
      tr.querySelector('input[name=st]').value = '';
      tr.querySelector('.use-color').checked = false;
      tr.querySelector('.pick-color').value = '#fefcbf';
      rows.appendChild(tr);
      sync(tr);
      addState();
      tr.querySelector('input[name=st]').focus();
    });
    addState();
    // A field that the type in use had was unticked — its values in items will be deleted: confirmation
    form.addEventListener('submit', function (e) {
      if (!+form.dataset.used) return;
      var dropped = Array.prototype.some.call(form.querySelectorAll('tr[data-was-on="1"]'), function (tr) {
        return !tr.querySelector('input[name=on]').checked;
      });
      if (dropped) appConfirm(e, form.dataset.confirm, form.dataset.ok);
    });
  })();
</script>
</body>
</html>
