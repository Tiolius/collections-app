<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main>
  <div class="bar">
    <a class="btn light back" href="/kinds" title="Назад" aria-label="Назад"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></a>
    <h2 th:text="${title}"></h2>
  </div>
  <form class="form" method="post">
    <label for="f-name">Название типа *</label>
    <input id="f-name" type="text" name="name" required autofocus th:value="${kind != null ? kind.name() : ''}">

    <label>Поля объектов</label>
    <div>
      <label class="radio"><input type="checkbox" checked disabled> Название</label>
      <label class="radio" th:each="f : ${fieldNames}">
        <input type="checkbox" name="fields" th:value="${f.key}" th:checked="${kind != null and kind.fields().contains(f.key)}">
        <span th:text="${f.value}"></span>
      </label>
    </div>

    <label class="top">Цвет строки по статусу</label>
    <div>
      <table class="status-colors">
        <tr><th>Статус</th><th>Цвет</th></tr>
        <tr th:each="e : ${statusColors}">
          <td><input type="text" name="st" list="status-hints" th:value="${e.key}"></td>
          <td><input type="color" name="stc" th:value="${e.value}"></td>
        </tr>
        <tr th:each="i : ${emptyRows}">
          <td><input type="text" name="st" list="status-hints" placeholder="статус"></td>
          <td><input type="color" name="stc" value="#fefcbf"></td>
        </tr>
      </table>
      <datalist id="status-hints"><option th:each="h : ${statusHints}" th:value="${h}"></option></datalist>
      <div class="muted hint">Строки объектов с этим статусом закрашиваются выбранным цветом (регистр букв не важен).
        Чтобы убрать цвет, очистите статус. Нужно больше строк — сохраните, и появятся новые пустые.
        Работает, если у типа отмечено поле «Статус прохождения».</div>
    </div>

    <p class="full muted" style="margin:0" th:if="${kind != null and kind.used() > 0}"
       th:text="${'Тип используется в коллекциях: ' + kind.used() + '. Если снять поле, его значения у объектов не удалятся, а только перестанут показываться.'}"></p>

    <div class="full">
      <button class="btn">Сохранить</button>
      <a class="btn gray" href="/kinds">Отмена</a>
    </div>
  </form>
</main>
</body>
</html>
