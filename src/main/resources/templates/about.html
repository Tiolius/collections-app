<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('about')}"></th:block>
  <form autocomplete="off" class="form" onsubmit="return false">
    <label for="f-version" th:text="#{about.version}">Версия</label>
    <input autocomplete="off" id="f-version" type="text" readonly th:value="${appVersion}">

    <label for="f-author" th:text="#{about.author}">Автор</label>
    <input autocomplete="off" id="f-author" type="text" readonly th:value="${appAuthor}">

    <label for="f-email">Email</label>
    <input autocomplete="off" id="f-email" type="text" readonly th:value="${appEmail}">

    <label for="f-date" th:text="#{about.date}">Дата обновления</label>
    <input autocomplete="off" id="f-date" type="text" readonly th:value="${appBuildDate}">

    <!-- Обновления: последний релиз на GitHub (Updates) -->
    <label th:text="#{about.updates}">Обновления</label>
    <div th:switch="${updateState}">
      <a th:case="'available'" th:href="${latestRelease.url()}" target="_blank" rel="noopener" th:text="#{update.download(${latestRelease.version()})}"></a>
      <span th:case="'latest'" th:text="#{update.latest}"></span>
      <span th:case="'failed'" class="muted" th:text="#{update.failed}"></span>
      <span th:case="'off'" class="muted" th:text="#{update.off}"></span>
      <span th:case="*" class="muted" th:text="#{update.unknown}"></span>
    </div>

    <!-- Год — из даты обновления (дд.мм.гггг) -->
    <div class="full muted" th:text="${'© ' + #strings.substring(appBuildDate, appBuildDate.length() - 4) + ' ' + appAuthor + '. Collections App'}"></div>
  </form>
</main>
</body>
</html>
