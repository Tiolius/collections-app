<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коллекции</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f6; color: #222; }
  header { background: #2d3748; color: #fff; padding: 12px 20px; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); display: flex; flex-direction: column; }
  .card img, .noimg { width: 100%; height: 160px; object-fit: cover; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #999; }
  .card .body { padding: 10px 12px; flex: 1; }
  .card .name { font-weight: 600; }
  .type { color: #666; font-size: 14px; }
  .card .actions { display: flex; gap: 6px; padding: 0 12px 12px; }
  a.card-link { text-decoration: none; color: inherit; }
  .btn { display: inline-block; padding: 7px 14px; border-radius: 6px; border: none; background: #3182ce; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
  .btn.gray { background: #718096; }
  .btn.red { background: #e53e3e; }
  form.inline { display: inline; }
  .form { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; }
  .form label { display: block; margin: 12px 0 4px; font-weight: 600; }
  .form input[type=text] { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; }
  .preview { max-width: 200px; max-height: 200px; display: block; margin: 8px 0; border-radius: 6px; }
  .head { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .head img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
  .empty { color: #777; }
</style>
</head>
<body>
<header th:fragment="header"><a href="/">📦 Коллекции</a></header>
</body>
</html>
