<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{app.title}">Коллекции</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script th:inline="javascript">
  // Тексты для скриптов страниц — на языке интерфейса (messages*.properties, ключи js.*)
  var T = {
    confirm: [[#{js.confirm}]], close: [[#{js.close}]], cancel: [[#{js.cancel}]], del: [[#{js.delete}]],
    openFull: [[#{js.openFull}]], willRemove: [[#{js.willRemove}]], newImage: [[#{js.newImage}]],
    ratingOf: [[#{js.ratingOf}]], ratingNone: [[#{js.ratingNone}]], decimal: [[#{js.decimal}]],
    ogNeedId: [[#{js.ogNeedId}]], ogLoading: [[#{js.ogLoading}]], ogLoaded: [[#{js.ogLoaded}]], ogAnd: [[#{js.ogAnd}]],
    ogNoImages: [[#{js.ogNoImages}]], ogImages: [[#{js.ogImages}]], ogSave: [[#{js.ogSave}]], ogFailed: [[#{js.ogFailed}]],
    importQueued: [[#{js.importQueued}]], importRunning: [[#{js.importRunning}]]
  };
  // Слово для числа: forms — «картинка|картинки|картинок» (русский) или «image|images» (английский)
  function plural(n, forms) {
    var f = forms.split('|');
    if (f.length < 3) return n === 1 ? f[0] : f[1];
    var d = n % 10, h = n % 100;
    return d === 1 && h !== 11 ? f[0] : d >= 2 && d <= 4 && (h < 12 || h > 14) ? f[1] : f[2];
  }
  // Язык интерфейса: cookie «lang» (читает сервер, I18n) и та же страница заново
  function setLang(lang) {
    document.cookie = 'lang=' + lang + '; path=/; max-age=31536000; SameSite=Lax';
    location.replace(location.href);
  }
  // Меню языков (флажки) в шапке: открыть/закрыть; закрывается щелчком мимо и Esc
  function toggleLangMenu(btn, open) {
    var menu = btn.nextElementSibling;
    if (open === undefined) open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open);
  }
  document.addEventListener('click', function (e) {
    var btn = document.querySelector('header .lang-btn');
    if (btn && !btn.parentNode.contains(e.target)) toggleLangMenu(btn, false);
  });
  document.addEventListener('keydown', function (e) {
    var btn = document.querySelector('header .lang-btn');
    if (e.key === 'Escape' && btn && !btn.nextElementSibling.hidden) { toggleLangMenu(btn, false); btn.focus(); }
  });
  // Тема из прошлого раза (localStorage) — до отрисовки, чтобы не мигала светлая
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  function toggleTheme() {
    var dark = document.documentElement.dataset.theme !== 'dark';
    if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  }
  /*
   * Подтверждение в окне приложения (вместо браузерного confirm): onclick="return appConfirm(event, 'Удалить …?')"
   * у кнопки или onsubmit="return appConfirm(event, '…')" у формы. Отправка отменяется, а после «Удалить»
   * форма отправляется заново той же кнопкой (formaction, formnovalidate сохраняются). Esc, щелчок мимо окна,
   * крестик и «Отмена» — ничего не делать. Кнопки: «Удалить» слева, «Отмена» справа, фокус — на «Отмене».
   */
  function appConfirm(e, message, okText) {
    var btn = e.type === 'click' ? e.currentTarget : null, form = btn ? btn.form : e.currentTarget;
    if (!btn && form.dataset.confirmed) { delete form.dataset.confirmed; return true; } // уже подтверждено
    e.preventDefault();
    var submitter = btn || e.submitter || undefined, dlg = document.getElementById('confirm-dialog');
    if (!dlg) {
      dlg = document.createElement('dialog');
      dlg.id = 'confirm-dialog'; dlg.className = 'modal confirm';
      dlg.innerHTML = '<div class="modal-head"><span>' + T.confirm + '</span>'
        + '<button type="button" class="icon" data-cancel title="' + T.close + '" aria-label="' + T.close + '"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="m249-207-42-42 231-231-231-231 42-42 231 231 231-231 42 42-231 231 231 231-42 42-231-231-231 231Z"/></svg></button></div>'
        + '<div class="confirm-body"><span class="confirm-icon"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M40-120 480-880l440 760H40Zm104-60h672L480-760 144-180Zm361.5-65.5Q517-257 517-274t-11.5-28.5Q494-314 477-314t-28.5 11.5Q437-291 437-274t11.5 28.5Q460-234 477-234t28.5-11.5ZM447-354h60v-224h-60v224Zm33-116Z"/></svg></span><p></p></div>'
        + '<div class="dlg-foot"><button type="button" class="btn red" data-ok></button>'
        + '<button type="button" class="btn light" data-cancel>' + T.cancel + '</button></div>';
      document.body.appendChild(dlg);
      dlg.querySelectorAll('[data-cancel]').forEach(function (b) { b.addEventListener('click', function () { dlg.close(); }); });
      dlg.addEventListener('click', function (ev) { if (ev.target === dlg) dlg.close(); }); // щелчок мимо окна
      dlg.querySelector('[data-ok]').addEventListener('click', function () { dlg.close(); if (dlg.onOk) dlg.onOk(); });
    }
    dlg.querySelector('p').textContent = message;
    dlg.querySelector('[data-ok]').textContent = okText || T.del;
    dlg.onOk = function () {
      if (!btn) form.dataset.confirmed = '1';
      if (form.requestSubmit) form.requestSubmit(submitter); else form.submit();
    };
    dlg.showModal();
    dlg.querySelector('.dlg-foot [data-cancel]').focus();
    return false;
  }
</script>
<style>
  /* ===== Оформление в «каталожном» стиле: Tahoma, синие шапки таблиц, серые полосы строк, оранжевый акцент ===== */

  /* Цвета. Светлая тема по умолчанию, тёмная — <html data-theme="dark"> (переключатель в шапке) */
  :root {
    --page: #ddd;           /* поля по бокам */
    --paper: #fff;          /* основная область */
    --text: #222; --muted: #666;
    --link: #1c58a9;        /* ссылки, названия */
    --blue: #316dbe; --on-blue: #fff;   /* шапки таблиц, основные кнопки, активная вкладка */
    --orange: #e88a1c; --on-orange: #fff;  /* акцент: активная страница, тип коллекции */
    --label: #333;          /* подписи полей в формах — тёмный текст, без отдельного синего */
    --heading: #1c58a9;     /* заголовки страниц — как ссылки, спокойнее шапок таблиц */
    --zebra: #f5f5f5;       /* чётные строки таблиц */
    --panel: #f3f3f3;       /* строка фильтров, полоса вкладок, поле только для чтения */
    --form-bg: #fafafa;
    --border: #d4d4d4; --input-border: #aaa; --line: #dcdcdc;
    --bar-from: #fafafa; --bar-to: #e4e4e4; --bar-border: #bdbdbd; --bar-sep: #cfcfcf; --bar-hover: #fff;
    --btn2-from: #f4f4f4; --btn2-to: #dedede; --btn2-border: #b9b9b9;
    --hover: #f5f9ff; --icon: #9a9a9a; --placeholder: #ddd;
    --red: #c62828; --on-red: #fff;
    --error-bg: #fde3e3; --error-text: #7a1010; --ok-bg: #e2f3dc; --ok-text: #234d14;
    --tip-bg: #333; --tip-text: #fff;
    --overlay: rgba(0,0,0,.35); --overlay-hover: rgba(0,0,0,.55); --on-overlay: #fff;  /* кнопки и надписи поверх картинки */
    --swatch-text: #222;    /* текст на цветном ярлыке статуса (цвета статусов светлые в обеих темах) */
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #15171b; --paper: #1f2227; --text: #dddddd; --muted: #9aa0a8;
    --link: #6aa8ff; --blue: #316dbe; --on-blue: #fff; --orange: #e88a1c; --on-orange: #fff; --label: #c8ccd2; --heading: #6aa8ff;
    --zebra: #262a30; --panel: #2a2e35; --form-bg: #23262c;
    --border: #3a3e46; --input-border: #5a606a; --line: #343840;
    --bar-from: #2c3037; --bar-to: #22252b; --bar-border: #3a3e46; --bar-sep: #3a3e46; --bar-hover: #34383f;
    --btn2-from: #353941; --btn2-to: #2b2f36; --btn2-border: #4a4f58;
    --hover: #26303d; --icon: #8a9099; --placeholder: #33373e;
    --red: #c62828; --on-red: #fff;
    --error-bg: #5c2626; --error-text: #fde3e3; --ok-bg: #22432f; --ok-text: #e2f3dc;
    --tip-bg: #3a3f47; --tip-text: #e6e6e6;  /* тёмная подсказка, светлее фона страницы */
    --swatch-text: #222;
  }

  /* Шрифт: Tahoma (где его нет — Verdana/Liberation Sans) везде (поля, списки и кнопки наследуют). Размер 13px везде, крупнее — только заголовки */
  * { box-sizing: border-box; }
  input, select, button, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  body { font-family: Tahoma, Verdana, "Liberation Sans", Geneva, sans-serif; font-size: 13px; margin: 0; background: var(--page); color: var(--text); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 { margin: 0; font-size: 18px; color: var(--heading); }
  h3.section { margin: 24px 0 10px; padding: 4px 10px; font-size: 14px; color: var(--on-blue); background: var(--blue); }
  main { background: var(--paper); max-width: 1500px; margin: 0 auto; min-height: calc(100vh - 34px); padding: 16px 24px;
         border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  input[type=checkbox], input[type=radio] { accent-color: var(--blue); width: 15px; height: 15px; }

  /* Иконки Material Symbols (встроенный SVG, цвет — как у текста) */
  .mi { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; vertical-align: middle; }

  /* Верхнее меню */
  /* Шапка той же ширины, что и белая область страницы (main, до 1500px по центру): кнопки справа заканчиваются
     ровно на её правой границе, и вертикальная линия идёт из шапки вниз без излома */
  header { display: flex; align-items: center; justify-content: space-between; height: 34px;
           padding: 0 max(0px, calc((100% - 1500px) / 2));
           background: linear-gradient(var(--bar-from), var(--bar-to)); border-bottom: 1px solid var(--bar-border); color: var(--text); }
  header a { color: inherit; text-decoration: none; }
  header a:hover { text-decoration: none; }
  /* Логотип — ячейка с линиями слева (по левой границе белой области) и справа, как у кнопок справа */
  header .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: bold; height: 100%; padding: 0 14px 0 24px;
                 border-left: 1px solid var(--bar-sep); border-right: 1px solid var(--bar-sep); }
  header .logo .mi { color: var(--orange); }
  /* Логотип — книги на полке (контурная иконка, рисуется линией, а не заливкой) */
  header .logo .logo-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  header .right, header nav { display: flex; align-items: stretch; height: 100%; }
  header .right { border-right: 1px solid var(--bar-sep); }
  header .user, header a.update, header a.search, header a.settings, header .theme, header .lang-btn, header .logout { display: inline-flex; align-items: center; gap: 6px; height: 100%;
           padding: 0 14px; border: none; border-left: 1px solid var(--bar-sep); background: none; font-weight: bold; cursor: pointer; }
  header .user { cursor: default; }
  header .mi { width: 16px; height: 16px; }
  header a.update { color: var(--orange); }  /* новая версия приложения — администратору */
  header a.settings:hover, header a.update:hover, header a.search:hover, header .theme:hover, header .lang-btn:hover, header .logout:hover { background: var(--bar-hover); }
  /* Язык интерфейса: кнопка-глобус и меню из двух флажков под ней (у правого края кнопки) */
  header .lang { position: relative; display: flex; height: 100%; }
  header .lang-menu { position: absolute; top: 100%; right: 0; z-index: 20; min-width: 150px; padding: 4px 0; margin-top: 1px;
                      background: var(--paper); border: 1px solid var(--bar-border); box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  header .lang-menu[hidden] { display: none; }
  header .lang-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 12px; border: none;
                             border-left: 3px solid transparent; background: none; color: var(--text); text-align: left; cursor: pointer; }
  header .lang-menu button:hover { background: var(--hover); }
  header .lang-menu button.active { border-left-color: var(--orange); font-weight: bold; }
  .lang-flag { width: 21px; height: 14px; flex-shrink: 0; box-shadow: 0 0 0 1px var(--border); }  /* рамка: белая полоса видна на белом */
  header .theme .sun, :root[data-theme="dark"] header .theme .moon { display: none; }
  :root[data-theme="dark"] header .theme .sun { display: inline; }

  /* Кнопки: основная (синяя), вторичная (серая), удаление (красная) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; padding: 0 12px;
         border-radius: 2px; border: 1px solid transparent; background: var(--blue); color: var(--on-blue); font-weight: bold;
         text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); text-decoration: none; }
  .btn .mi { width: 16px; height: 16px; margin-left: -2px; }
  .btn.gray, .btn.light { background: linear-gradient(var(--btn2-from), var(--btn2-to)); color: var(--link); border-color: var(--btn2-border); }
  .btn.red { background: var(--red); color: var(--on-red); }
  /* Удаление — серая кнопка с красным текстом (не так бросается в глаза, как синяя «Сохранить») */
  .btn.danger { color: var(--red); }
  .btn.back { width: 26px; padding: 0; background: none; border: none; color: var(--blue); }
  .btn.back .mi { width: 22px; height: 22px; margin: 0; }
  .btn.small { height: 24px; padding: 0 10px; }
  .btn.disabled { opacity: .45; cursor: default; pointer-events: none; }
  form.inline { display: inline; }

  /* Иконки действий в строках */
  .icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0;
          border: none; border-radius: 2px; background: none; color: var(--icon); cursor: pointer; vertical-align: middle; }
  .icon:hover { color: var(--link); background: var(--hover); }
  .icon.red:hover { color: var(--red); }
  .icon.disabled { opacity: .45; cursor: not-allowed; }
  .icon.big { width: 30px; height: 30px; }
  .icon.big .mi { width: 22px; height: 22px; }
  .icon.add { color: var(--blue); }  /* создание: «+» и папка с плюсом */
  .icon.add .mi { width: 26px; height: 26px; }
  .icon.disabled:hover { color: var(--icon); background: none; }

  /* Панели, подписи, сообщения */
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .bar .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .type { color: var(--orange); }
  .name { font-weight: bold; }
  .empty { color: var(--muted); }
  .error, .ok { padding: 8px 12px; }
  .error { background: var(--error-bg); color: var(--error-text); }
  .ok { background: var(--ok-bg); color: var(--ok-text); }

  /* Вход */
  main.auth { min-height: 0; max-width: 520px; margin: 60px auto 0; border: none; background: none; }
  main.auth h2 { margin-bottom: 12px; }
  main.auth .form { grid-template-columns: 160px 1fr; }

  /* Вкладки «Настроек»: активная — синяя */
  /* Настройки: разделы столбцом слева, содержимое раздела справа (main.settings) */
  main.settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); column-gap: 24px; align-content: start; }
  main.settings > .bar:first-child { grid-column: 1 / -1; }  /* заголовок «Настройки» — на всю ширину */
  main.settings > nav.tabs { grid-column: 1; grid-row: 2 / span 50; align-self: start; }
  main.settings > :not(:first-child):not(nav.tabs) { grid-column: 2; }
  main.settings > nav.tabs + * { margin-top: 0; }  /* содержимое раздела — вровень с верхом списка разделов */
  nav.tabs { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); }
  nav.tabs a { padding: 8px 12px; color: var(--muted); border-left: 3px solid transparent; }
  nav.tabs a + a { border-top: 1px solid var(--line); }
  nav.tabs a:hover { color: var(--link); text-decoration: none; background: var(--hover); }
  nav.tabs a.active { background: var(--blue); color: var(--on-blue); border-left-color: var(--orange); }
  table.users { max-width: 900px; }

  /* Главная: карточки коллекций в 2 колонки, 10 на странице */
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .list .row { display: flex; align-items: center; gap: 18px; height: 92px; padding: 0 12px; border: 1px solid var(--border);
               background: var(--paper); text-decoration: none; color: inherit; min-width: 0; }
  .list .row:hover { background: var(--hover); text-decoration: none; }
  .list .row > div { min-width: 0; }
  .list .name { color: var(--link); margin-bottom: 4px; }
  .list .name, .list .type { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .stats { margin-top: 4px; }  /* счётчики коллекции: всего · в наличии · стоимость */
  .list .thumb { width: 76px; height: 76px; }
  .thumb { width: 48px; height: 48px; flex-shrink: 0; object-fit: cover; background: var(--placeholder); display: block; }

  /* Номера страниц: квадратные ячейки, текущая — оранжевая */
  /* Блок с названием коллекции и кнопками — тонкая рамка и фон, как у форм */
  .collhead { border: 1px solid var(--border); padding: 8px 12px; background: var(--form-bg); }
  .collhead .coll-actions { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; margin-left: auto; }
  .collhead .thumb { width: 56px; height: 56px; }
  .pages { display: inline-flex; align-items: center; }
  .pages a, .pages b { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 24px; padding: 0 6px;
                       margin-left: -1px; border: 1px solid var(--input-border); background: var(--paper); color: var(--text); font-weight: normal; }
  .pages a:hover { background: var(--hover); text-decoration: none; }
  .pages b { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
  .pages .muted { padding: 0 4px; }
  .pager select { height: 24px; }

  /* Таблицы: синяя шапка, строки через одну серые */
  table.items { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--paper); }
  table.items th, table.items td { padding: 3px 6px; text-align: left; }
  table.items th { position: relative; font-weight: bold; }
  table.items thead tr:first-child th { background: var(--blue); color: var(--on-blue); padding: 6px 16px 6px 6px; }
  /* Названия столбцов (содержимое ячеек — как было): в таблицах настроек — по левому краю; в таблице объектов
     (data-cols) «Название» — по левому краю, остальные — по центру */
  table.items thead tr:first-child th { text-align: left; }
  table.items[data-cols] thead tr:first-child th { text-align: center; padding-left: 16px; }  /* отступы поровну — текст ровно по центру */
  table.items[data-cols] thead tr:first-child th.pic-col { padding-left: 2px; }
  table.items[data-cols] thead tr:first-child th.c-name { text-align: left; padding-left: 6px; }
  /* Галочки строк (массовые действия): узкий первый столбец; выбранная строка подсвечена */
  table.items th.sel, table.items td.sel { width: 28px; text-align: center; padding-left: 2px; padding-right: 2px; }
  table.items[data-cols] thead tr:first-child th.sel { padding: 6px 2px; }
  table.items tbody tr.picked td { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--blue) 12%, transparent); }
  /* Панель массовых действий — над таблицей, пока выбран хотя бы один объект */
  .bulk { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; padding: 8px 12px;
          border: 1px solid var(--blue); background: var(--form-bg); }
  .bulk[hidden], .bulk select[hidden] { display: none; }
  table.items th a.sort { color: inherit; display: block; }
  table.items th a.sort:hover { text-decoration: underline; }
  /* Шапка таблицы (заголовки и фильтры) остаётся наверху при прокрутке */
  table.items thead { position: sticky; top: 0; z-index: 2; }
  table.items tr.filters th { background: var(--panel); padding: 4px 6px; font-weight: normal; border-bottom: 1px solid var(--border); }
  table.items tr.filters input, table.items tr.filters select { width: 100%; min-width: 0; }
  table.items tr.filters select { min-width: 8em; }
  table.items.fixed tr.filters select { min-width: 0; }
  /* Фильтр цены «от — до»: два поля без стрелок */
  table.items tr.filters .range { display: flex; gap: 4px; }
  table.items tr.filters .range input { min-width: 4.5em; appearance: textfield; -moz-appearance: textfield; }
  table.items.fixed tr.filters .range input { min-width: 0; }
  table.items tr.filters .range input::-webkit-inner-spin-button, table.items tr.filters .range input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  table.items tr.filters .active { border-color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }
  table.items tr.head th.actions { padding: 3px 6px; font-weight: normal; }
  /* «Сбросить фильтры» — иконка в строке фильтров; когда фильтры заданы — оранжевая (как активный фильтр) */
  table.items tr.filters th.actions { padding: 2px 6px; }
  /* Иконки после «На странице»: сброс ширины столбцов и фильтров — в одном стиле (серые, при наведении синие;
     сброс фильтров без заданных фильтров — бледный) */
  .pager-tools { display: inline-flex; align-items: center; gap: 2px; }
  table.items td.empty { text-align: center; padding: 16px; }
  table.items td { height: 30px; line-height: 1.4; }
  table.items tbody tr:nth-child(even) td { background: var(--zebra); }
  /* Цвет строки по статусу (CSS-переменная --row-bg): бледная заливка (полосы зебры не перебивает)
     при наведении строка чуть темнеет */
  table.items tbody tr[style] td { background: color-mix(in srgb, var(--row-bg) 40%, var(--paper)); }
  :root[data-theme="dark"] table.items tbody tr[style] td { background: color-mix(in srgb, var(--row-bg) 18%, var(--paper)); }
  table.items tbody tr:hover td { box-shadow: inset 0 0 0 9999px rgba(0,0,0,.04); }
  :root[data-theme="dark"] table.items tbody tr:hover td { box-shadow: inset 0 0 0 9999px rgba(255,255,255,.04); }
  table.items[data-cols] td.title { color: var(--link); }
  table.items td.title a.edit-item, table.items td.title a.edit-item:hover, table.items td.title a.edit-item:focus, table.items td.title a.edit-item:active { color: inherit; text-decoration: none; }
  /* Режим «Дубли»: первая строка каждой группы одинаковых названий — с линией сверху */
  table.items tbody tr.gstart td { border-top: 2px solid var(--border); }
  /* Название забирает всё свободное место, остальные столбцы — по содержимому */
  table.items th, table.items td { width: 1%; white-space: nowrap; }
  table.items .title { width: auto; white-space: normal; }
  table.items .num { text-align: right; }
  table.items .actions { text-align: right; }
  /* Границы столбцов — тонкие линии */
  table.items thead tr:first-child th + th { border-left: 1px solid rgba(255,255,255,.6); }
  table.items td + td, table.items tr.filters th + th { border-left: 1px solid var(--line); }
  /* Ручка — невидимая полоса у правого края заголовка (курсор ↔) */
  table.items .grip { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; }
  body.resizing { cursor: col-resize; user-select: none; }
  /* После ручной настройки ширины — фиксированная раскладка, длинный текст обрезается */
  table.items.fixed { table-layout: fixed; }
  table.items.fixed td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.items.fixed td.actions { overflow: visible; }
  /* Цена: иконка глаза, сама цена — в подсказке */
  table.items th.eye, table.items td.eye { text-align: center; }
  /* Наличие: галочка — есть, крестик (бледный) — нет */
  table.items th.flag, table.items td.flag { text-align: center; }
  table.items td.date { text-align: center; }
  /* Теги: небольшие ярлыки в строке */
  .tag { display: inline-block; padding: 0 6px; margin: 1px 4px 1px 0; border: 1px solid var(--line); border-radius: 8px;
         background: var(--panel); line-height: 18px; }
  /* Рейтинг: контурные звёзды и поверх закрашенные (видна часть ширины) */
  .stars { position: relative; display: inline-block; white-space: nowrap; line-height: 0; vertical-align: middle; }
  .stars .mi { width: 14px; height: 14px; }
  .stars-off { display: inline-block; color: var(--icon); opacity: .6; }
  .stars-on { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--orange); }
  .stars.edit { cursor: pointer; }
  .stars.edit .mi { width: 22px; height: 22px; }
  .stars.edit:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .rating-input { display: inline-flex; align-items: center; gap: 8px; min-height: 26px; }
  .rating-input .rating-text { min-width: 3.5em; }
  table.items th.rating, table.items td.rating { text-align: center; white-space: nowrap; }
  table.items td.flag .avail { display: inline-flex; vertical-align: middle; }
  table.items td.flag .avail.yes { color: var(--link); }
  table.items td.flag .avail.no { color: var(--muted); opacity: .6; }
  /* Колонка «есть картинка»: узкая, иконка по центру */
  table.items th.pic-col, table.items td.pic-col { width: 64px; text-align: center; padding-left: 2px; padding-right: 2px; }
  table.items thead tr:first-child th.pic-col { padding: 6px 2px; }
  table.items th.pic-col .mi { width: 15px; height: 15px; }
  table.items tr.filters th.pic-col select { min-width: 0; padding-left: 2px; padding-right: 0; }
  table.items td.pic-col .has-pic { color: var(--icon); display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; }
  table.items td.pic-col .pic-n { line-height: 1; }
  table.items td.pic-col .mi { width: 16px; height: 16px; }
  table.items.fixed td.eye { overflow: visible; }
  .tip { position: relative; cursor: default; }
  .tip.none > svg { opacity: .45; }  /* бледная только иконка: подсказка остаётся непрозрачной */
  .tip .tiptext { display: none; position: absolute; right: calc(100% + 6px); top: 50%; transform: translateY(-50%);
                  background: var(--tip-bg); color: var(--tip-text); padding: 2px 8px; white-space: nowrap; z-index: 3; line-height: 20px;
                  font-weight: normal; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .tip:hover .tiptext, .tip:focus .tiptext { display: block; }
  :root[data-theme="dark"] .tip .tiptext { border: 1px solid var(--input-border); }  /* тёмная подсказка отделена рамкой */
  .tip.right .tiptext { right: auto; left: calc(100% + 6px); }  /* подсказка справа от иконки */
  /* Справка: большая подсказка под иконкой, с переносами, абзацами */
  .tip.help { display: inline-flex; vertical-align: middle; margin-left: 4px; color: var(--icon); cursor: help; }
  .tip.help .tiptext { top: calc(100% + 6px); left: 0; right: auto; transform: none; width: min(560px, calc(100vw - 48px));
                       white-space: normal; line-height: 1.5; padding: 8px 12px; text-align: left; }
  .tip.help:hover .tiptext, .tip.help:focus .tiptext { display: flex; flex-direction: column; gap: 6px; }
  .icon.small { width: 20px; height: 20px; }   /* иконка в строке текста (стоимость коллекции) */
  .icon.small .mi { width: 16px; height: 16px; }
  .icon.small:hover { background: none; }
  .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .meta-line > span { white-space: nowrap; }  /* строка «Тип · Объектов · стоимость» на одной линии */

  /* Формы: подпись слева (жирная, сине-серая), поле справа */
  .form { background: var(--form-bg); border: 1px solid var(--border); padding: 16px 24px; max-width: 900px;
          display: grid; grid-template-columns: 200px 1fr; gap: 10px 16px; align-items: center; }
  .form > label { font-weight: bold; color: var(--label); }
  /* короткая подпись: колонка по её ширине; отступ подпись → поле равен отступу поле → кнопка (.inline) */
  .form.compact { --gap: 75px; grid-template-columns: auto 1fr; column-gap: var(--gap); }
  .form.compact .inline { column-gap: var(--gap); }
  .form .full { grid-column: 1 / -1; }
  .form .full.split { display: flex; justify-content: space-between; align-items: center; }  /* кнопки по краям формы */
  .form .full.end { display: flex; justify-content: flex-end; }  /* кнопка у правого края формы */
  .form .inline { display: flex; align-items: center; gap: 8px 24px; flex-wrap: wrap; }  /* поле и кнопка в одну строку */
  input[type=text], input[type=number], input[type=password], input[type=search], select {
      height: 26px; padding: 0 8px; border: 1px solid var(--input-border); border-radius: 0; background: var(--paper); }
  input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, input[type=search]:focus, select:focus {
      outline: none; border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
  input[readonly] { background: var(--panel); border-color: var(--line); cursor: default; }
  input[readonly]:focus { box-shadow: none; border-color: var(--input-border); }
  .form input[type=text], .form input[type=number], .form input[type=password], .form select { width: 100%; max-width: 360px; }
  .form select.narrow { width: auto; }
  .form input[name=name] { max-width: none; }
  /* Описание объекта — многострочное поле во всю ширину колонки полей */
  textarea { padding: 6px 8px; border: 1px solid var(--input-border); border-radius: 0; background: var(--paper); line-height: 1.4; }
  textarea:focus { outline: none; border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
  .form textarea { width: 100%; resize: vertical; }
  .form label.radio { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; font-weight: normal; color: var(--text); }
  .form > label.top { align-self: start; padding-top: 24px; }
  .form > label.at-field { align-self: start; padding-top: 6px; }  /* поле с подсказкой под ним */
  table.status-colors { border-collapse: collapse; }
  table.status-colors th { text-align: left; font-weight: normal; color: var(--muted); padding: 0 8px 4px 0; }
  table.status-colors td { padding: 0 8px 6px 0; }
  table.status-colors input[type=text] { width: 260px; }
  .form input[type=color] { width: 44px; height: 26px; padding: 2px; border: 1px solid var(--input-border); background: var(--paper); cursor: pointer; }
  .hint { margin-top: 2px; max-width: 560px; }
  /* Модальное окно (изменение объекта): синяя полоса заголовка, внутри — обычная форма */
  dialog.modal { padding: 0; border: 1px solid var(--border); background: var(--form-bg); color: var(--text);
                 width: 640px; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  dialog.modal::backdrop { background: rgba(0,0,0,.4); }
  dialog.modal .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 12px;
                             background: var(--blue); color: var(--on-blue); font-weight: bold; }
  dialog.modal .modal-head .icon { color: var(--on-blue); }
  dialog.modal .modal-head .icon:hover { background: rgba(255,255,255,.15); color: var(--on-blue); }
  /* Подписи — по ширине самой длинной, небольшой отступ до поля */
  dialog.modal .form { border: none; max-width: none; grid-template-columns: auto 1fr; column-gap: 12px; }
  .swatch { display: inline-block; padding: 1px 8px; margin: 1px 4px 1px 0; border-radius: 8px; border: 1px solid var(--line); color: var(--swatch-text); line-height: 18px; }
  .preview { max-width: 160px; max-height: 160px; display: block; margin-bottom: 6px; }
  /* Окно объекта с картинкой: поля слева, картинка 800×600 справа (вписана целиком) */
  /* Ширина окна задаётся от картинки (поля 480px + картинка + кнопки и отступы), а не по содержимому:
     если чему-то не хватит места, ужмётся картинка, а окно не будет прокручиваться вбок */
  dialog.modal.wide { width: min(calc(100vw - 32px), calc(var(--pic-w) + 560px)); overflow-x: hidden; }
  /* Ширина области картинки (4:3): до 800px, но так, чтобы окно помещалось на экране без прокрутки */
  dialog.modal { --pic-w: min(800px, calc(100vw - 600px), calc((100vh - 190px) * 4 / 3)); }
  dialog.modal .dlg-foot { display: flex; justify-content: space-between; gap: 4px; padding: 10px 24px;
                           border-top: 1px solid var(--border); background: var(--panel); }
  /* Кнопка, стоящая в разметке после «Сохранить» (чтобы Enter сохранял, а не удалял), но показанная слева */
  .dlg-foot .first, .form .full.split > .first { order: -1; }
  .form .full.split > .btn.danger { display: inline-flex; align-items: center; gap: 4px; }
  /* Окно подтверждения (appConfirm): значок предупреждения и вопрос, внизу «Отмена» и красная «Удалить» */
  dialog.modal.confirm { width: 420px; }
  /* Поле «Old-Games.ru»: адрес, «Загрузить», «Открыть»; под ними — итог загрузки */
  .og-row { display: flex; gap: 6px; align-items: center; }
  .og-row input { flex: 1; min-width: 0; max-width: none !important; }
  .og-load:disabled { opacity: .4; cursor: wait; }  /* идёт загрузка */
  .og-status { margin-top: 4px; }
  .form > label.og-label { align-self: start; padding-top: 6px; }  /* подпись — на уровне поля, а не по центру вместе с итогом */
  .og-status.ok { color: var(--ok-text); }
  .og-status.error { color: var(--red); }
  dialog.modal .confirm-body { display: flex; align-items: center; gap: 12px; padding: 20px 24px; }
  dialog.modal .confirm-body p { margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
  dialog.modal .confirm-icon { color: var(--red); flex-shrink: 0; }
  dialog.modal .confirm-icon .mi { width: 28px; height: 28px; }
  dialog.modal.confirm .dlg-foot { justify-content: flex-end; gap: 8px; }
  dialog.modal .pic { display: block; cursor: pointer; }
  dialog.modal a.pic:not([href]) { cursor: default; }  /* выбранный, ещё не сохранённый файл */
  /* Кнопки картинки — столбиком справа от неё: заменить, открыть, ниже с отступом — удалить */
  dialog.modal .img-tools { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  dialog.modal .img-tools label.icon { cursor: pointer; }
  dialog.modal .img-tools .spacer { flex: none; height: 24px; }
  dialog.modal .dlg-image > .viewer { grid-column: 1; grid-row: 1; position: relative; }
  /* Перелистывание картинок: полупрозрачные круглые кнопки у левого и правого края картинки (нажимается вся полоса края),
     счётчик внизу справа */
  dialog.modal .viewer .nav { position: absolute; top: 0; bottom: 0; width: 64px; display: flex; align-items: center; justify-content: center;
                              border: none; padding: 0; background: none; color: var(--on-overlay); cursor: pointer; }
  dialog.modal .viewer .nav .mi { width: 44px; height: 44px; padding: 6px; border-radius: 50%; background: var(--overlay); }
  dialog.modal .viewer .nav:hover .mi, dialog.modal .viewer .nav:focus-visible .mi { background: var(--overlay-hover); }
  dialog.modal .viewer .nav.prev { left: 0; }
  dialog.modal .viewer .nav.next { right: 0; }
  dialog.modal .viewer .counter { position: absolute; right: 8px; bottom: 8px; padding: 1px 8px; background: var(--overlay-hover);
                                  color: var(--on-overlay); pointer-events: none; }
  dialog.modal .dlg-image > .img-tools { grid-column: 2; grid-row: 1; }
  dialog.modal .dlg-image [hidden] { display: none !important; }
  /* Заглушка «Нет картинки»: рамка 800×600 с иконкой */
  dialog.modal .no-image { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
                           width: 100%; aspect-ratio: 4 / 3; cursor: pointer; color: var(--muted);
                           background: var(--panel); border: 2px dashed var(--border); }
  dialog.modal .no-image .mi { width: 96px; height: 96px; opacity: .6; }
  dialog.modal .no-image b { color: var(--text); }
  dialog.modal .no-image:hover { border-color: var(--blue); color: var(--link); }
  dialog.modal .no-image:hover .mi { opacity: 1; }
  dialog.modal .dlg-body { display: flex; align-items: stretch; }
  dialog.modal .dlg-body > .form { flex: 1; }
  /* Поля — во всю высоту окна: строки полей по содержимому (их число — --rows), строка «Описание» занимает остальное */
  dialog.modal.wide .dlg-body > .form { flex: 0 0 480px; grid-template-rows: repeat(var(--rows), min-content) 1fr; align-items: center; }
  dialog.modal.wide .dlg-body > .form.after-desc { grid-template-rows: repeat(var(--rows), min-content) 1fr min-content; }
  dialog.modal.wide .form > label[for=d-description] { align-self: start; padding-top: 6px; }
  dialog.modal.wide #d-description { height: 100%; min-height: 160px; resize: none; }
  dialog.modal .dlg-image { order: 2; padding: 16px 24px 16px 0; display: grid; grid-template-columns: minmax(0, var(--pic-w)) auto;
                          justify-content: center; align-items: start; gap: 8px; flex: 1 1 auto; min-width: 0; }
  dialog.modal .dlg-image img { display: block; width: 100%; aspect-ratio: 4 / 3; height: auto;
                                object-fit: contain; background: var(--panel); border: 1px solid var(--border); }
  @media (max-width: 1100px) {
    dialog.modal .dlg-body { flex-direction: column; align-items: stretch; }
    dialog.modal.wide .dlg-body > .form { flex: none; grid-template-rows: none; }
    dialog.modal.wide #d-description { height: auto; resize: vertical; }
    dialog.modal .dlg-image { order: 2; padding: 0 16px 16px 24px; grid-template-columns: minmax(0, 1fr) auto; }  /* сначала поля, под ними картинка */
    dialog.modal.wide { width: calc(100vw - 32px); }  /* узкий экран: окно во всю ширину, картинка под полями */
    dialog.modal .dlg-image img, dialog.modal .no-image { width: 100%; }
  }
  /* Экспорт: список коллекций с галочками в столбик */
  .export-list { display: grid; gap: 6px; max-height: 420px; overflow: auto; }
  .export-list .all { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  /* Импорт: прогресс */
  .import-box { border: 1px solid var(--border); background: var(--form-bg); padding: 12px; margin-bottom: 12px; display: grid; gap: 8px; max-width: 900px; }
  .import-box progress { width: 100%; height: 16px; accent-color: var(--blue); }
  .import-box form { margin: 0; }
  .import-box[hidden], .form[hidden] { display: none; }
  /* Поиск по всем коллекциям */
  .search-form { display: flex; gap: 8px; max-width: 900px; margin-bottom: 16px; }
  .search-form input { flex: 1; min-width: 0; }
  table.items.found { max-width: 1200px; }
  /* Статистика: плитки итогов, полосы (рейтинг, покупки по годам) */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .tile { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--border); background: var(--form-bg); }
  .tile b { font-size: 18px; color: var(--heading); }
  .tile span { color: var(--muted); }
  .tile .icon { color: var(--icon); }
  table.items.stats td a { display: block; }
  .stat-blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); column-gap: 24px; }
  .bars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; max-width: 560px; }
  .bar-track { height: 14px; background: var(--panel); border: 1px solid var(--line); }
  .bar-fill { display: block; height: 100%; background: var(--blue); }
  .bar-value { white-space: nowrap; }  /* атрибут hidden иначе перебивается display: grid */

  @media (max-width: 420px) {
    header .logo span { display: none; }  /* узкий телефон: в шапке только значок логотипа, иначе кнопки не помещаются */
  }
  @media (max-width: 700px) {
    main.settings { grid-template-columns: 1fr; }
    main.settings > nav.tabs { grid-row: auto; margin-bottom: 14px; }
    main.settings > :not(:first-child):not(nav.tabs) { grid-column: 1; }
    main { padding: 12px; border: none; }
    header .logo { padding-left: 12px; border-left: none; }  /* на телефоне у страницы нет боковых линий */
    header .right { border-right: none; }
    /* справка — во всю ширину формы, сразу под иконкой */
    .form > label:has(.tip.help) { position: relative; }
    .tip.help { position: static; }
    .tip.help .tiptext { left: 0; right: 0; top: calc(100% + 4px); width: auto; }
    .form, .form.compact { grid-template-columns: 1fr; }
    .list { grid-template-columns: 1fr; }
    header .user span, header a.settings span, header a.update span { display: none; }
    /* Таблица объектов на телефоне: название, статус, цена и корзина; платформа, формат и иконка картинки — в окне объекта */
    table.items .c-platform, table.items .c-format, table.items .c-edition, table.items .c-purchased, table.items .c-tags,
    table.items .c-rating, table.items .c-available, table.items .pic-col { display: none; }
    table.items .grip, #reset-widths { display: none; }
    table.items tr.filters select, table.items tr.filters .range input { min-width: 0; }
    table.items tr.filters .range { flex-direction: column; gap: 2px; }
    table.items td.title { overflow-wrap: anywhere; }
    .collhead { flex-wrap: wrap; align-items: flex-start; }  /* на телефоне стрелка «назад» — по строке названия */
    .collhead > .back { margin-top: -3px; }   /* (21px строка названия − 26px кнопка) / 2 */
    .collhead > div { flex: 1 1 200px; min-width: 0; }
    /* на телефоне иконки — отдельной строкой, начинаются ровно под названием (после стрелки 26px и промежутка 12px;
       если у коллекции есть картинка — ещё 56px + 12px) */
    .collhead > .coll-actions { margin-top: 0; margin-left: 36px; }  /* 38px минус внутренний отступ иконки */
    .collhead:has(> .thumb) > .coll-actions { margin-left: 104px; }
    .meta-line { column-gap: 12px; }
    .meta-line .sep { display: none; }  /* точки-разделители повисали в конце строк */
  }
</style>
</head>

    // Ширина пунктов меню — целое число пикселей: иначе линия-разделитель встаёт между пикселями и выглядит размытой
    (function () {
      var items = document.querySelectorAll('header .logo, header .right a.search, header .right .user, header .right a.update, header .right a.settings, header .right .theme, header .right .lang-btn, header .right .logout');
      function fit() {
        items.forEach(function (e) { e.style.width = ''; });
        items.forEach(function (e) { e.style.width = Math.ceil(e.getBoundingClientRect().width) + 'px'; });
      }
      fit();
      addEventListener('resize', fit);
    })();

<script th:fragment="ratingScript">
  // Поля «Рейтинг» (ratingInput): показ значения, выбор щелчком и клавиатурой. setRating(поле, 0…10) — для окна объекта
  window.setRating = function (box, v) {
    v = Math.max(0, Math.min(10, v | 0));
    box.querySelector('input').value = v;
    box.querySelector('.stars-on').style.width = v * 10 + '%';
    box.querySelector('.stars').setAttribute('aria-valuenow', v / 2);
    box.querySelector('.rating-text').textContent = v ? T.ratingOf.replace('{0}', String(v / 2).replace('.', T.decimal)) : T.ratingNone;
    box.querySelector('.rating-clear').style.visibility = v ? '' : 'hidden'; // место остаётся — звёзды не прыгают
  };
  document.querySelectorAll('.rating-input').forEach(function (box) {
    var stars = box.querySelector('.stars'), on = box.querySelector('.stars-on'), input = box.querySelector('input');
    function at(e) { // сколько половинок под курсором: 1…10
      var r = stars.getBoundingClientRect();
      return Math.max(1, Math.min(10, Math.ceil((e.clientX - r.left) / r.width * 10)));
    }
    stars.addEventListener('mousemove', function (e) { on.style.width = at(e) * 10 + '%'; });
    stars.addEventListener('mouseleave', function () { on.style.width = input.value * 10 + '%'; });
    stars.addEventListener('click', function (e) { var v = at(e); setRating(box, v === +input.value ? 0 : v); });
    stars.addEventListener('keydown', function (e) {
      var v = +input.value;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') v++;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') v--;
      else if (e.key === 'Delete' || e.key === 'Backspace' || e.key === '0') v = 0;
      else return;
      e.preventDefault(); e.stopPropagation(); // стрелки не листают картинки в окне объекта
      setRating(box, v);
    });
    box.querySelector('.rating-clear').addEventListener('click', function () { setRating(box, 0); });
    setRating(box, +input.value);
  });
</script>

<script>
  // Изменение объекта в модальном окне
  (function () {
    var dlg = document.getElementById('item-dialog');
    if (!dlg || typeof dlg.showModal !== 'function') return; // нет <dialog> — название откроет отдельную страницу
    var form = dlg.querySelector('form');
    // Картинки справа (до 5): у каждой — слот { saved: адрес сохранённой, chosen: выбранный файл, removed: удалить }.
    // Последний слот пустой («Нет картинки») — чтобы добавить ещё одну, пока их меньше 5. Стрелки листают слоты.
    // Корзина сразу показывает заглушку; на сервере картинки меняются только при сохранении (поля image_N и remove=N)
    var MAX = 5, slots = [], cur = 0;
    function $(id) { return document.getElementById(id); }
    function srcOf(s) { return s.chosen || (s.saved && !s.removed ? s.saved : null); }
    function addEmptySlot() {
      if (slots.length < MAX && srcOf(slots[slots.length - 1])) slots.push({});
    }
    function render() {
      var s = slots[cur], src = srcOf(s);
      $('d-pic').hidden = !src;
      $('d-noimg').hidden = !!src;
      $('d-tools').hidden = !src;
      if (src) document.querySelector('#d-pic img').src = src;
      // щелчок открывает только сохранённую картинку; у выбранного, ещё не сохранённого файла — ничего
      if (s.chosen) { $('d-pic').removeAttribute('href'); $('d-pic').removeAttribute('title'); }
      else if (src) { $('d-pic').href = src; $('d-pic').title = T.openFull; }
      ['d-noimg', 'd-replace'].forEach(function (id) { $(id).htmlFor = 'd-file-' + cur; });
      $('d-open').hidden = !!s.chosen || !s.saved || s.removed;
      if (s.saved) $('d-open').href = s.saved;
      var many = slots.length > 1, filled = slots.filter(srcOf).length;
      $('d-prev').hidden = $('d-next').hidden = !many;
      $('d-count').hidden = !many;
      $('d-count').textContent = src ? (slots.slice(0, cur + 1).filter(srcOf).length + ' / ' + filled)
          : s.removed ? T.willRemove : T.newImage;
    }
    function go(step) { cur = (cur + step + slots.length) % slots.length; render(); }
    $('d-prev').addEventListener('click', function () { go(-1); });
    $('d-next').addEventListener('click', function () { go(1); });
    dlg.addEventListener('keydown', function (e) { // стрелки клавиатуры — если курсор не в поле ввода
      if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || slots.length < 2) return;
      if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
    });
    $('d-remove').addEventListener('click', function () {
      var s = slots[cur];
      $('d-file-' + cur).value = ''; s.chosen = null;
      if (s.saved) { s.removed = true; $('d-remove-' + cur).disabled = false; } // сохранённую — удалить при сохранении
      render();
    });
    for (var i = 0; i < MAX; i++) (function (n) {
      $('d-file-' + n).addEventListener('change', function () {
        var s = slots[n];
        s.chosen = this.files[0] ? URL.createObjectURL(this.files[0]) : null;
        if (s.chosen) { s.removed = false; $('d-remove-' + n).disabled = true; } // новый файл заменит картинку
        addEmptySlot();
        render();
      });
    })(i);
    document.querySelectorAll('a.edit-item').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var row = a.closest('tr');
        form.action = '/items/' + row.dataset.id + '/edit';
        document.getElementById('d-delete').formAction = '/items/' + row.dataset.id + '/delete';
        ['name', 'platform', 'format', 'status', 'price', 'description', 'purchased', 'tags', 'edition', 'notes'].forEach(function (f) {
          if (form.elements[f]) form.elements[f].value = row.dataset[f] || '';
        });
        // Статус не из списка (старое значение) — показываем его отдельным пунктом, чтобы оно не потерялось
        var st = document.getElementById('d-status');
        if (st) {
          st.querySelectorAll('option.legacy').forEach(function (o) { o.remove(); });
          var v = row.dataset.status || '';
          if (!Array.prototype.some.call(st.options, function (o) { return o.value === v; })) {
            var o = new Option(v, v); o.className = 'legacy'; st.add(o);
          }
          st.value = v;
        }
        var rb = document.querySelector('#item-dialog .rating-input');
        if (rb) setRating(rb, +row.dataset.rating || 0);
        var avail = document.getElementById('d-available');
        if (avail) avail.checked = row.dataset.available === '1';
        if ($('d-oldgames')) { $('d-oldgames').value = row.dataset.oldgames || ''; $('d-og-status').hidden = true; ogSync(); }
        itemId = row.dataset.id;
        // Картинки: сохранённые (адреса по хешу содержимого — из кеша браузера) и пустой слот; выбор файлов и пометки удаления — сброшены
        slots = (row.dataset.pics || '').split(',').filter(Boolean).map(function (h) { return { saved: '/img/' + h }; });
        if (!slots.length) slots.push({});
        addEmptySlot();
        for (var j = 0; j < MAX; j++) { $('d-file-' + j).value = ''; $('d-remove-' + j).disabled = true; }
        cur = 0;
        render();
        dlg.showModal();
        form.elements.name.focus();
      });
    });
    dlg.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { dlg.close(); }); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); }); // щелчок мимо окна

    // Old-Games.ru: «Загрузить» берёт описание и картинки со страницы игры (сервер, POST /items/{id}/oldgames) и
    // подставляет их в окно: описание — в поле, картинки — в поля image_N (как выбранные файлы), прежние картинки —
    // на удаление. На сервере всё меняется только при «Сохранить»
    var itemId = null;
    // номер игры: введённое число или число из вставленного адреса страницы …/game/11.html
    function ogId(v) {
      v = v.trim();
      if (/^\d{1,7}$/.test(v)) return v;
      var m = /old-games\.ru\/game\/(\d{1,7})\.html/i.exec(v);
      return m ? m[1] : null;
    }
    function ogUrl(id) { return 'https://www.old-games.ru/game/' + id + '.html'; }
    function ogSync() { // вставленный адрес — в номер; «открыть» — только при номере
      var input = $('d-oldgames'), id = ogId(input.value);
      if (id && input.value.trim() !== id) input.value = id;
      $('d-og-open').style.display = id ? '' : 'none'; // атрибут hidden перебивается стилем .icon
      if (id) $('d-og-open').href = ogUrl(id);
    }
    function ogStatus(text, ok) { var s = $('d-og-status'); s.hidden = false; s.textContent = text; s.className = 'og-status ' + (ok ? 'ok' : 'error'); }
    if ($('d-oldgames')) {
      $('d-oldgames').addEventListener('input', ogSync);
      $('d-og-load').addEventListener('click', function () {
        var btn = this, id = ogId($('d-oldgames').value);
        if (!id) { ogStatus(T.ogNeedId, false); return; }
        var url = ogUrl(id);
        btn.disabled = true; ogStatus(T.ogLoading, true);
        fetch('/items/' + itemId + '/oldgames', { method: 'POST', body: new URLSearchParams({ url: url }) })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.error) { ogStatus(d.error, false); return; }
            $('d-oldgames').value = ogId(d.url) || id; ogSync();
            if (d.description) form.elements.description.value = d.description;
            if (d.images.length) {
              // прежние сохранённые картинки — на удаление, загруженные — на места 0…n-1
              slots.forEach(function (s, k) { if (s.saved) $('d-remove-' + k).disabled = false; });
              for (var j = 0; j < MAX; j++) $('d-file-' + j).value = '';
              slots = d.images.map(function (im, k) {
                var bin = atob(im.data), bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                var file = new File([bytes], 'old-games-' + (k + 1) + '.' + im.mime.split('/')[1], { type: im.mime });
                var dt = new DataTransfer(); dt.items.add(file); $('d-file-' + k).files = dt.files;
                $('d-remove-' + k).disabled = true; // новый файл на этом месте сам заменит прежнюю картинку
                return { chosen: URL.createObjectURL(file) };
              });
              addEmptySlot(); cur = 0; render();
            }
            var n = d.images.length;
            ogStatus(T.ogLoaded + (n ? T.ogAnd.replace('{0}', n + ' ' + plural(n, T.ogImages)) : T.ogNoImages) + T.ogSave, true);
          })
          .catch(function () { ogStatus(T.ogFailed, false); })
          .finally(function () { btn.disabled = false; });
      });
    }
  })();
</script>
</th:block>
</body>
