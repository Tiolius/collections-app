<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коллекции</title>
<script>
  // Тема из прошлого раза (localStorage) — до отрисовки, чтобы не мигала светлая
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  function toggleTheme() {
    var dark = document.documentElement.dataset.theme !== 'dark';
    if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  }
</script>
<style>
  /* Цвета темы. Светлая — по умолчанию, тёмная — <html data-theme="dark"> (переключатель в шапке) */
  :root {
    --bg: #f4f4f6; --text: #222; --muted: #666; --surface: #fff; --surface-2: #edf2f7; --surface-3: #f7fafc;
    --placeholder: #e2e8f0; --border: #cbd5e0; --line: #d5dde6; --icon: #4a5568; --link: #2b6cb0; --accent: #3182ce;
    --hover-accent: #ebf4ff; --header-bg: #2d3748; --tip-bg: #2d3748;
    --error-bg: #fed7d7; --error-text: #9b2c2c; --ok-bg: #c6f6d5; --ok-text: #22543d;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15181e; --text: #e2e8f0; --muted: #a0aec0; --surface: #1f242d; --surface-2: #2a313c; --surface-3: #232933;
    --placeholder: #343c48; --border: #4a5568; --line: #3a4350; --icon: #cbd5e0; --link: #63b3ed; --accent: #3182ce;
    --hover-accent: #23344a; --header-bg: #0f1115; --tip-bg: #4a5568;
    --error-bg: #5c2626; --error-text: #fed7d7; --ok-bg: #22432f; --ok-text: #c6f6d5;
  }
  /* Цвет статуса в тёмной теме приглушается — смешивается с фоном таблицы, текст остаётся светлым */
  :root[data-theme="dark"] table.items tbody tr[style] td { background: color-mix(in srgb, var(--row-bg) 30%, var(--surface)); }
  /* Поля ввода — в цветах темы */
  input[type=text], input[type=number], input[type=password], input[type=search] { background: var(--surface); color: var(--text); }
  /* Переключатель темы в шапке: в светлой теме видна луна, в тёмной — солнце */
  header .theme { background: none; border: none; color: #fff; opacity: .85; cursor: pointer; padding: 2px; display: inline-flex; }
  header .theme:hover { opacity: 1; }
  header .theme .sun, :root[data-theme="dark"] header .theme .moon { display: none; }
  :root[data-theme="dark"] header .theme .sun { display: inline; }
  header .right { display: flex; align-items: center; gap: 18px; }

  * { box-sizing: border-box; }
  /* Шрифты: один шрифт везде (поля, списки и кнопки по умолчанию берут шрифт браузера — наследуем).
     Размеры: 15px — основной текст, шапка, формы, кнопки; 14px — таблицы и панель над таблицей;
     крупнее — только заголовки страниц и разделов */
  input, select, button, textarea { font-family: inherit; font-size: inherit; }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); font-size: 15px; }
  header { background: var(--header-bg); color: #fff; padding: 8px 24px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header nav { display: flex; align-items: center; gap: 18px; }
  header .user { display: inline-flex; align-items: center; gap: 6px; color: #fff; opacity: .9; }
  header a.settings { font-weight: normal; opacity: .85; }
  header a.settings:hover { opacity: 1; }
  /* Выход и тема — иконки в шапке в одном стиле */
  header .logout { background: none; border: none; color: #fff; opacity: .85; cursor: pointer; padding: 2px; display: inline-flex; }
  header .logout:hover { opacity: 1; }
  /* Вход и регистрация */
  main.auth { max-width: 520px; margin: 60px auto 0; }
  main.auth h2 { margin-bottom: 12px; }
  main.auth .form { grid-template-columns: 160px 1fr; }
  .error { background: var(--error-bg); color: var(--error-text); padding: 8px 12px; border-radius: 6px; }
  .ok { background: var(--ok-bg); color: var(--ok-text); padding: 8px 12px; border-radius: 6px; }
  .form input[type=password] { width: 100%; max-width: 360px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; }
  h3.section { margin: 28px 0 10px; }
  /* Вкладки «Настроек» */
  nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
  nav.tabs a { padding: 8px 16px; color: var(--icon); text-decoration: none; border-radius: 6px 6px 0 0;
               margin-bottom: -2px; border-bottom: 2px solid transparent; }
  nav.tabs a:hover { background: var(--surface-2); color: var(--text); }
  nav.tabs a.active { color: var(--link); border-bottom-color: var(--accent); font-weight: 600; }
  table.users { max-width: 900px; }
  /* На всю ширину экрана; отступы по краям небольшие */
  main { padding: 16px 24px; }
  h2 { margin: 0; font-size: 22px; }
  a { color: var(--link); }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .bar .spacer { flex: 1; }
  .muted, .type { color: var(--muted); }
  .name { font-weight: 600; }
  .empty { color: var(--muted); }

  /* Главная: коллекции в 2 колонки, 10 на странице (5 рядов) — помещаются на экран 1920×1080 */
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .list .row { display: flex; align-items: center; gap: 18px; height: 148px; padding: 0 12px; background: var(--surface); border-radius: 8px;
               box-shadow: 0 1px 2px rgba(0,0,0,.08); text-decoration: none; color: inherit; min-width: 0; }
  .list .row:hover { background: var(--hover-accent); }
  .list .row > div { min-width: 0; }
  .list .name, .list .type { font-size: 16px; }
  .list .name { margin-bottom: 4px; }
  .list .name, .list .type { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .thumb { width: 128px; height: 128px; border-radius: 8px; }
  .thumb { width: 48px; height: 48px; flex-shrink: 0; object-fit: cover; border-radius: 6px; background: var(--placeholder); display: block; }

  /* Страница коллекции: шапка в одну строку, таблица на всю ширину */
  .collhead .thumb { width: 56px; height: 56px; }
  table.items { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  table.items { font-size: 14px; }
  table.items th, table.items td { padding: 5px 12px; text-align: left; border-top: 1px solid var(--surface-2); }
  table.items th { background: var(--surface-2); border-top: none; position: relative; }
  /* Шапка таблицы (заголовки и фильтры) остаётся наверху при прокрутке */
  table.items thead { position: sticky; top: 0; z-index: 2; }
  table.items tr.filters th { background: var(--surface-3); padding: 4px 6px; border-top: 1px solid var(--line); font-weight: normal; }
  table.items tr.filters input, table.items tr.filters select { width: 100%; min-width: 0;
      padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); }
  table.items tr.filters select { min-width: 8em; }
  table.items.fixed tr.filters select { min-width: 0; }
  table.items tr.filters .active { border-color: var(--accent); background: var(--hover-accent); }
  table.items tr.head th.actions { padding: 3px 8px; font-weight: normal; }
  .btn.disabled { opacity: .45; cursor: default; }
  table.items td.empty { text-align: center; padding: 16px; }
  /* Цвет строки по статусу задаётся переменной --row-bg; при наведении строка чуть темнеет */
  table.items tbody td { background: var(--row-bg, transparent); }
  table.items tbody tr:hover td { box-shadow: inset 0 0 0 9999px rgba(0,0,0,.04); }
  /* Название забирает всё свободное место, остальные столбцы — по содержимому */
  table.items th, table.items td { width: 1%; white-space: nowrap; }
  table.items .title { width: auto; white-space: normal; }
  table.items .num { text-align: right; }
  table.items .actions { text-align: right; }
  table.items th { padding-right: 16px; }
  table.items th a.sort { color: inherit; text-decoration: none; display: block; }
  table.items th a.sort:hover { color: var(--link); }
  /* Ручка для изменения ширины столбца — правый край заголовка */
  /* Границы столбцов — тонкие линии и в строках, и в заголовке */
  table.items td + td, table.items th + th { border-left: 1px solid var(--line); }
  /* Ручка — невидимая полоса у правого края заголовка (курсор ↔) */
  table.items .grip { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; }
  body.resizing { cursor: col-resize; user-select: none; }
  /* После ручной настройки ширины — фиксированная раскладка, длинный текст обрезается */
  table.items.fixed { table-layout: fixed; }
  table.items.fixed td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.items.fixed td.actions { overflow: visible; }
  .pager { font-size: 14px; }
  .pager .pages a, .pager .pages b, .pager > a, .pager > b { padding: 2px 6px; }
  .pager b { background: var(--accent); color: #fff; border-radius: 4px; }
  /* Иконки действий в строке: карандаш и корзина */
  .icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; padding: 0;
          border: none; border-radius: 6px; background: none; color: var(--icon); cursor: pointer; vertical-align: middle; }
  .icon:hover { background: var(--placeholder); color: var(--link); }
  .icon.red:hover { background: var(--error-bg); color: #e53e3e; }
  .icon.disabled { color: var(--border); cursor: not-allowed; }
  /* Цена: иконка глаза, сама цена — в подсказке при наведении */
  table.items th.eye, table.items td.eye { text-align: center; }
  table.items.fixed td.eye { overflow: visible; }
  .tip { position: relative; cursor: default; }
  .tip.none { color: var(--border); }
  .tip .tiptext { display: none; position: absolute; right: calc(100% + 6px); top: 50%; transform: translateY(-50%);
                  background: var(--tip-bg); color: #fff; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 2; }
  .tip:hover .tiptext, .tip:focus .tiptext { display: block; }

  .btn { display: inline-block; padding: 6px 14px; border-radius: 6px; border: none; background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; line-height: 1.4; }
  .btn.gray { background: #718096; }
  .btn.red { background: #e53e3e; }
  .btn.light { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn.light:hover { background: var(--surface-2); }
  .btn.back { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 34px; padding: 0; }
  .btn.small { padding: 3px 10px; }
  form.inline { display: inline; }

  /* Форма: подпись слева, поле справа */
  .form { background: var(--surface); padding: 16px 20px; border-radius: 8px; max-width: 900px;
          display: grid; grid-template-columns: 200px 1fr; gap: 10px 16px; align-items: center; }
  .form > label { font-weight: 600; }
  .form .full { grid-column: 1 / -1; }
  select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
  .form select { width: 100%; max-width: 360px; }
  .pager select { padding: 3px 6px; }
  .form input[type=text], .form input[type=number] { width: 100%; max-width: 360px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .form input[name=name] { max-width: none; }
  .form label.radio { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; font-weight: normal; }
  .form > label.top { align-self: start; padding-top: 30px; }
  table.status-colors { border-collapse: collapse; }
  table.status-colors th { text-align: left; font-weight: normal; color: var(--muted); padding: 0 8px 4px 0; }
  table.status-colors td { padding: 0 8px 6px 0; }
  table.status-colors input[type=text] { width: 260px; }
  .form input[type=color] { width: 48px; height: 34px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; }
  .hint { margin-top: 2px; max-width: 560px; }
  .swatch { display: inline-block; padding: 1px 8px; margin: 1px 4px 1px 0; border-radius: 10px; border: 1px solid rgba(0,0,0,.08); color: #1a202c; }
  .preview { max-width: 160px; max-height: 160px; display: block; margin-bottom: 6px; border-radius: 6px; }

  @media (max-width: 700px) {
    main { padding: 12px; }
    .form { grid-template-columns: 1fr; }
    .list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header th:fragment="header">
  <a href="/">📦 Collections App</a>
  <div class="right">
    <nav th:if="${currentUser != null}">
      <span class="user" th:title="${currentUser.isAdmin() ? 'Администратор' : 'Пользователь'}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span th:text="${currentUser.name()}"></span>
      </span>
      <a class="settings" href="/kinds" th:title="${currentUser.isAdmin() ? 'Типы коллекций, пароль, пользователи' : 'Типы коллекций, пароль'}">⚙ Настройки</a>
    </nav>
    <button type="button" class="theme" onclick="toggleTheme()" title="Светлая / тёмная тема" aria-label="Переключить тему">
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <form class="inline" method="post" action="/logout" th:if="${currentUser != null}">
      <button class="logout" title="Выйти" aria-label="Выйти">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.56v16.16a1 1 0 0 1-1.24.97L5 20V5.56a2 2 0 0 1 1.52-1.94l4-1A2 2 0 0 1 13 4.56Z"/></svg>
      </button>
    </form>
  </div>
</header>

<!-- Шапка страницы «Настройки» с вкладками; active — kinds | account | users -->
<th:block th:fragment="settingsHead(active)">
  <div class="bar">
    <a class="btn light back" href="/" title="Все коллекции" aria-label="Все коллекции"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
    <h2>Настройки</h2>
  </div>
  <nav class="tabs">
    <a href="/kinds" th:classappend="${active == 'kinds'} ? 'active'">Типы коллекций</a>
    <a href="/account" th:classappend="${active == 'account'} ? 'active'">Пароль</a>
    <a href="/users" th:if="${currentUser.isAdmin()}" th:classappend="${active == 'users'} ? 'active'">Пользователи</a>
  </nav>
</th:block>
</body>
</html>
