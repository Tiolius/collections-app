<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('cache')}"></th:block>
  <h3 class="section">Картинки коллекции</h3>
  <p class="ok" th:if="${param.deleted != null}" th:text="${'Удалено картинок: ' + param.deleted}"></p>
  <p class="empty" th:if="${collections.isEmpty()}">Коллекций пока нет.</p>

  <form autocomplete="off" class="form" method="post" action="/cache/clear" th:unless="${collections.isEmpty()}"
        onsubmit="return confirm('Удалить все картинки объектов коллекции «' + this.collection.selectedOptions[0].dataset.name + '»?')">
    <label for="f-coll">Коллекция
      <span class="icon tip help" tabindex="0" aria-label="Справка"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
        <span class="tiptext">
          <span>Удаляются все картинки всех объектов выбранной коллекции — и загруженные вручную, и полученные импортом. Обложка самой коллекции, названия, поля и описания объектов не меняются.</span>
          <span>Вернуть картинки можно повторным импортом на вкладке «Импорт».</span>
        </span>
      </span>
    </label>
    <select id="f-coll" name="collection" required>
      <option th:each="c : ${collections}" th:value="${c.id()}" th:attr="data-name=${c.name()}"
              th:text="${c.name() + ' (картинок: ' + imageCounts.getOrDefault(c.id(), 0) + ')'}"
              th:selected="${param.c != null and param.c[0] == '' + c.id()}"></option>
    </select>
    <div class="full end"><button class="btn red">Удалить все картинки</button></div>
  </form>
</main>
</body>
</html>
