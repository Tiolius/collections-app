<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>
<header th:replace="~{base :: header}"></header>
<main class="settings">
  <th:block th:replace="~{base :: settingsHead('cache')}"></th:block>
  <h3 class="section" th:text="#{cache.title}">Картинки коллекции</h3>
  <!-- Deleting in progress: progress is updated by a script from /cache/status, when done the page reloads -->
  <div class="import-box" id="cache-job" th:if="${job != null and job.active()}">
    <div><span th:text="#{cache.deleting}">Удаление картинок:</span> <b th:text="${job.collectionName}"></b></div>
    <progress id="cj-bar" th:max="${job.total == 0 ? 1 : job.total}" th:value="${job.done}"></progress>
    <div><span th:text="#{cache.deleted}">Удалено</span> <span id="cj-done" th:text="${job.done}"></span> <span th:text="#{cache.of}">из</span> <span id="cj-total" th:text="${job.total}"></span></div>
  </div>
  <!-- Result of the last deletion -->
  <th:block th:if="${job != null and !job.active()}">
    <p class="ok" th:if="${job.state == 'done'}" th:text="#{cache.done(${job.done}, ${job.collectionName})}"></p>
    <p class="error" th:unless="${job.state == 'done'}" th:text="#{cache.failed(${job.collectionName}, ${job.done}, ${job.total})}"></p>
  </th:block>
  <p class="empty" th:if="${collections.isEmpty()}" th:text="#{collections.none}">Коллекций пока нет.</p>

  <form autocomplete="off" class="form compact" method="post" action="/cache/clear" th:unless="${collections.isEmpty() or (job != null and job.active())}"
        th:data-confirm="#{cache.confirm}" onsubmit="return appConfirm(event, this.dataset.confirm.replace('{0}', this.collection.selectedOptions[0].dataset.name))">
    <label for="f-coll"><span th:text="#{cache.collection}">Коллекция</span>
      <span class="icon tip help" tabindex="0" th:aria-label="#{help}"><svg class="mi" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
        <span class="tiptext">
          <span th:text="#{cache.help1}"></span>
          <span th:text="#{cache.help2}"></span>
        </span>
      </span>
    </label>
    <div class="inline">
      <select id="f-coll" name="collection" required>
        <option th:each="c : ${collections}" th:value="${c.id()}" th:attr="data-name=${c.name()}"
                th:text="${c.name() + ' ' + #messages.msg('cache.count', imageCounts.getOrDefault(c.id(), 0))}"
                th:selected="${job != null and job.collectionId == c.id()}"></option>
      </select>
      <button class="btn red" th:text="#{cache.deleteAll}">Удалить все картинки</button>
    </div>
  </form>
<script th:if="${job != null and job.active()}">
  // Deletion progress: ask for the state every half second; when finished, reload the page
  // (result and new picture counts in the collection list)
  (function () {
    function $(id) { return document.getElementById(id); }
    function tick() {
      fetch('/cache/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
        if (s.state !== 'queued' && s.state !== 'running') { location.reload(); return; }
        $('cj-bar').max = Math.max(s.total, 1); $('cj-bar').value = s.done;
        $('cj-done').textContent = s.done; $('cj-total').textContent = s.total;
        setTimeout(tick, 500);
      }).catch(function () { setTimeout(tick, 2000); });
    }
    setTimeout(tick, 500);
  })();
</script>
</main>
</body>
</html>
