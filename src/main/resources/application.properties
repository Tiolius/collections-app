server.port=8000

# База SQLite в папке данных (в Docker это /data)
spring.datasource.url=jdbc:sqlite:${DATA_DIR:/data}/app.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Создание таблиц при старте (schema.sql)
spring.sql.init.mode=always

# Картинки до 10 МБ
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Страница ошибки (templates/error.html) без технических подробностей; наши сообщения выводит ErrorPages
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Сессия входа: cookie недоступна скриптам и не отправляется с чужих сайтов (защита форм от подделки запросов)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
# Через HTTPS (в интернете): COOKIE_SECURE=true — cookie сессии только по HTTPS;
# FORWARD_HEADERS=native — если перед приложением прокси с HTTPS (адрес клиента и протокол из X-Forwarded-*)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=${FORWARD_HEADERS:none}
server.servlet.session.tracking-modes=cookie

# Версия приложения из pom.xml (подставляет Maven при сборке)
app.version=@project.version@
# Автор, email и дата обновления (дата сборки, подставляет Maven) — на вкладке «Настройки» → «О приложении»
app.author=Evered
app.email=morel7@mail.ru
app.build-date=@build.date@

