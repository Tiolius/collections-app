server.port=8000

# База SQLite в папке данных (в Docker это /data)
spring.datasource.url=jdbc:sqlite:${DATA_DIR:/data}/app.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Создание таблиц при старте (schema.sql)
spring.sql.init.mode=always

# Картинки до 10 МБ
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Показывать текст ошибки (например, "Название обязательно")
server.error.include-message=always
