server.port=8000

# SQLite database in the data folder (in Docker it is /data)
spring.datasource.url=jdbc:sqlite:${DATA_DIR:/data}/app.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Create tables at start (schema.sql)
spring.sql.init.mode=always

# Pictures up to 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Error page (templates/error.html) without technical details; our messages are shown by ErrorPages
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Login session: the cookie is not available to scripts and not sent from other sites (protects forms from request forgery)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
# Over HTTPS (on the internet): COOKIE_SECURE=true — session cookie over HTTPS only;
# FORWARD_HEADERS=native — if there is an HTTPS proxy in front of the application (client address and protocol from X-Forwarded-*)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=${FORWARD_HEADERS:none}
server.servlet.session.tracking-modes=cookie

# Application version from pom.xml (filled in by Maven at build)
app.version=@project.version@
# Author, email and update date (build date, filled in by Maven) — on the "Settings" → "About" tab
app.author=Evered
app.email=morel7@mail.ru
app.build-date=@build.date@


# Interface texts: messages.properties (Russian) and messages_en.properties (English), language — cookie "lang" (I18n).
# No fallback to the system language: on English Windows the Russian interface would otherwise take the English texts
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Update check (Updates): the latest release on GitHub every 12 hours; UPDATES_ENABLED=false — do not check
updates.enabled=${UPDATES_ENABLED:true}

# Styles and icon: the styles address contains the application version, so the browser may keep them long
spring.web.resources.cache.cachecontrol.max-age=365d
