import.help.steam=для игр: ищется игра с таким же названием, как у объекта (без учёта регистра, знаков ™ ® © и пунктуации), картинки — скриншоты из галереи игры (или шапка страницы игры и за ней скриншоты), описание — краткое описание игры (по-русски, если есть).
import.help.gog=для игр, в том числе старых, которых нет в Steam: ищется игра с таким же названием (английским или русским), картинки — скриншоты (или обложка коробки и за ней скриншоты), описание — по-русски, если у игры есть перевод, иначе по-английски.
import.help.discogs=для музыки: название объекта должно быть в виде «Группа - Альбом», ищется альбом с тем же названием у той же группы, картинки — обложка и другие картинки альбома (с токеном), описание — примечания альбома (Notes); объекты без « - » в названии пропускаются.
import.help.fantlab=для книг: название объекта «Автор - Книга» (как у дисков; без « - » ищется просто по названию), картинки — обложка и обложки изданий, описание — аннотация (FantLab — база фантастики, книги других жанров там есть не всегда).
import.help.speed=Сервисы ограничивают число запросов: на объект уходит около 1,5 секунды для Steam (около 3 секунд со скриншотом или описанием), 1–2 секунды для GOG, около 2 секунд для Discogs (до 4 секунд вместе с описанием) и около 3 секунд для FantLab. Страницу можно закрыть: импорт продолжится, прогресс будет виден здесь.
import.help.count=Картинок на объект — до скольких загружать, если у источника их несколько; уже загруженные картинки объекта при этом заменяются.
