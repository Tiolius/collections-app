import.sourceHelp=About the sources
import.help.steam=for games: looks for a game with the same name as the item (ignoring case, the ™ ® © signs and punctuation); images — screenshots from the game gallery (or the game page header followed by screenshots); description — the short description of the game (in Russian if available).
import.help.gog=for games, including old ones that are not on Steam: looks for a game with the same name (English or Russian); images — screenshots (or the box cover followed by screenshots); description — in Russian if the game has a translation, otherwise in English.
import.help.discogs=for music: the item name must look like “Artist - Album”; looks for an album with the same name by the same artist; images — the cover and other album images (with a token); description — the album notes; items without “ - ” in the name are skipped.
import.help.fantlab=for books: the item name is “Author - Book” (like for discs; without “ - ” it searches by name only); images — the cover and covers of editions; description — the annotation (FantLab is a science fiction and fantasy database, books of other genres are not always there).
import.help.speed=The services limit the number of requests: one item takes about 1.5 seconds for Steam (about 3 seconds with a screenshot or description), 1–2 seconds for GOG, about 2 seconds for Discogs (up to 4 seconds with the description) and about 3 seconds for FantLab. You can close the page: the import continues and its progress is shown here.
import.help.count=Images per item — how many to load when the source has several; the images the item already has are replaced.
